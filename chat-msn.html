<script>
    // ===================== AJUSTE DE ALTURA PARA TECLADO MOBILE =====================
    // Em vários navegadores mobile (principalmente Android), abrir o teclado NÃO
    // redimensiona a viewport visual da forma que "100dvh" espera, então o layout
    // (que usa flex + h-full) não encolhe e o teclado acaba cobrindo parte do chat.
    // Aqui a gente escuta o "visualViewport" (altura real visível na tela, sem o
    // teclado) e usa isso pra definir a altura do <body> via variável CSS --app-vh.
    // Assim a área de mensagens encolhe e o campo de digitar sempre fica visível
    // acima do teclado, igual WhatsApp/Telegram.
    //
    // Além disso, quando o teclado abre, a gente:
    //   1) adiciona a classe "keyboard-open" no <body> deste chat, pra esconder
    //      a barrinha de anúncio e o menu inferior (Chat/Contatos/Loja/Mais) e
    //      sobrar mais espaço pras mensagens;
    //   2) avisa a página que carrega este chat (via postMessage), pra ela
    //      também esconder o banner grande do topo e o anúncio de baixo.
    (function () {
        function applyViewportHeight() {
            var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            document.documentElement.style.setProperty('--app-vh', h + 'px');
        }
        applyViewportHeight();
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', applyViewportHeight);
            window.visualViewport.addEventListener('scroll', applyViewportHeight);
        }
        window.addEventListener('resize', applyViewportHeight);
        window.addEventListener('orientationchange', function () {
            setTimeout(applyViewportHeight, 300);
        });

        function notifyKeyboard(open) {
            try {
                window.parent.postMessage({ type: 'spfc-chat-keyboard', open: open }, '*');
            } catch (e) {}
        }

        function isTextField(el) {
            return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
        }

        // Quando um campo de texto recebe foco (teclado abrindo): aguarda o teclado
        // terminar de abrir, esconde a barra de anúncio/menu inferior e rola a tela
        // pra manter o campo/últimas mensagens visíveis.
        document.addEventListener('focusin', function (e) {
            if (!isTextField(e.target)) return;
            document.body.classList.add('keyboard-open');
            notifyKeyboard(true);
            var t = e.target;
            setTimeout(function () {
                applyViewportHeight();
                t.scrollIntoView({ block: 'end', behavior: 'smooth' });
            }, 250);
        });

        // Quando o campo perde o foco, só considera o teclado "fechado" se o foco
        // não pulou pra outro campo de texto (evita esconder/mostrar tudo à toa
        // ao trocar de um campo pra outro).
        document.addEventListener('focusout', function () {
            setTimeout(function () {
                if (!isTextField(document.activeElement)) {
                    document.body.classList.remove('keyboard-open');
                    notifyKeyboard(false);
                    applyViewportHeight();
                }
            }, 100);
        });
    })();
</script>

    // ===================== EMOTICONS CLÁSSICOS DO MSN =====================
    // Lista usada tanto para converter texto digitado (":)" -> 😊) quanto para
    // popular o painel visual de seleção de emoticons.
    const MSN_EMOTICONS = [
        { code: ":)", emoji: "😊", label: "Sorriso" },
        { code: ":-)", emoji: "😊", label: "Sorriso" },
        { code: ":D", emoji: "😃", label: "Risada" },

        { code: ":P", emoji: "😛", label: "Língua de fora" },
        { code: ":-P", emoji: "😛", label: "Língua de fora" },
        { code: ":(", emoji: "😦", label: "Triste" },
        { code: ":-(", emoji: "😦", label: "Triste" },
        { code: ":'(", emoji: "😢", label: "Chorando" },
        { code: ":o", emoji: "😮", label: "Surpreso" },
        { code: ":O", emoji: "😮", label: "Surpreso" },
        { code: "8)", emoji: "😎", label: "Descolado" },
        { code: ":@", emoji: "😠", label: "Bravo" },
        { code: ":s", emoji: "😕", label: "Confuso" },
        { code: ":S", emoji: "😕", label: "Confuso" },
        { code: "<3", emoji: "❤️", label: "Coração" },
        { code: "(y)", emoji: "👍", label: "Joinha" },
        { code: "(n)", emoji: "👎", label: "Joinha negativo" },
        { code: "*-*", emoji: "🤩", label: "Encantado" },
        { code: "^^", emoji: "😄", label: "Feliz" },
    ];
    // Ordena os códigos do mais longo para o mais curto, para que ":-)" seja
    // reconhecido antes de ":)"  e não sobre um "-)" solto no texto.
    const MSN_EMOTICON_REGEX = new RegExp(
        MSN_EMOTICONS.map(e => e.code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
            .sort((a, b) => b.length - a.length).join("|"),
        "g"
    );
    const MSN_EMOTICON_MAP = Object.fromEntries(MSN_EMOTICONS.map(e => [e.code, e.emoji]));

    // Converte um texto com códigos tipo ":)" em uma lista de pedaços de texto/emoji,
    // pronta para ser renderizada dentro de um <span> do React.
    function renderMsnText(text) {
        if (!text) return text;
        const parts = String(text).split(MSN_EMOTICON_REGEX);
        const matches = String(text).match(MSN_EMOTICON_REGEX) || [];
        const out = [];
        parts.forEach((part, i) => {
            if (part) out.push(part);
            if (matches[i]) {
                out.push(
                    React.createElement("span", {
                        key: `emo-${i}`,
                        className: "inline-block text-base align-[-2px] hover:scale-125 transition-transform",
                        title: matches[i]
                    }, MSN_EMOTICON_MAP[matches[i]])
                );
            }
        });
        return out;
    }

    const ORIGINAL_DOCUMENT_TITLE = document.title;

    function startTitleFlash(flashText) {

    // Alterna a reação de um usuário em uma mensagem do Firestore.
    // `docRef` é o doc() da mensagem (em "messages" ou em "private_chats/{id}/messages/{id}").
    // Estrutura salva no doc: reactions: { "like": ["uid1","uid2"], "love": ["uid3"] }
    async function toggleFirestoreReaction(docRef, currentReactions, key, uid) {
        const reactions = currentReactions || {};
        const already = (reactions[key] || []).includes(uid);
        // Remove o uid de qualquer outra reação (cada pessoa só pode ter 1 reação ativa por mensagem)
        const updates = {};
        Object.keys(reactions).forEach(k => {
            if (k !== key && (reactions[k] || []).includes(uid)) {
                updates[`reactions.${k}`] = arrayRemove(uid);
            }
        });
        updates[`reactions.${key}`] = already ? arrayRemove(uid) : arrayUnion(uid);
        try {
            await updateDoc(docRef, updates);
        } catch (err) {
            console.error("Erro ao reagir à mensagem:", err);
        }
    }

    // Alterna a reação de um usuário numa mensagem guardada no localStorage (modo sem Firebase)
    function toggleLocalReaction(messages, msgId, key, uid) {
        return messages.map(m => {
            if (m.id !== msgId) return m;
            const reactions = { ...(m.reactions || {}) };
            Object.keys(reactions).forEach(k => {
                reactions[k] = (reactions[k] || []).filter(id => id !== uid);
                if (reactions[k].length === 0) delete reactions[k];
            });
            const wasActive = ((m.reactions || {})[key] || []).includes(uid);
            if (!wasActive) {
                reactions[key] = [...(reactions[key] || []), uid];
            }
            return { ...m, reactions };
        });
    }

    // Barra de reações exibida abaixo de cada balão de mensagem: mostra as reações já usadas

    // --------------------------------------------------------------------------------
    // 3) ÁUDIO DE NOTIFICAÇÃO — sons clássicos do MSN
    // --------------------------------------------------------------------------------
    // Som tocado quando um contato entra/fica online.
    const NOTIFICATION_SOUND_URL = "https://files.catbox.moe/854omi.mp3";
    // Som do "Chamar Atenção" (nudge/buzz).
    const ATTENTION_SOUND_URL = "https://files.catbox.moe/cgbtes.mp3";
    // Som de mensagem recebida ("tibim").
    const MESSAGE_RECEIVED_SOUND_URL = "https://files.catbox.moe/7cavsb.mp3";

    // Todas as funções de som abaixo respeitam o toggle "Sons do Chat" das Configurações.
    // playNotificationSound(): dispara o áudio de forma assíncrona (fire-and-forget),
    // sem "await", para nunca travar a animação de entrada do toast.
    // Se o áudio não puder tocar (ex: autoplay bloqueado pelo navegador), cai
    // automaticamente para um bipe sintetizado via Web Audio API, só para não ficar mudo.
    function playNotificationSound() {
        if (!isSoundEnabled()) return;
        const audio = new Audio(NOTIFICATION_SOUND_URL);
        audio.volume = 0.6;
        audio.play().catch(() => {
            playFallbackBeep("online");
        });
    }

    // playAttentionSound(): toca o som do "Chamar Atenção" (buzz/nudge).
    function playAttentionSound() {
        if (!isSoundEnabled()) return;
        const audio = new Audio(ATTENTION_SOUND_URL);
        audio.volume = 0.7;
        audio.play().catch(() => {
            playFallbackBeep("nudge");
        });
    }

    // playMessageReceivedSound(): o clássico "tibim" de mensagem nova chegando.
    function playMessageReceivedSound() {
        if (!isSoundEnabled()) return;
        const audio = new Audio(MESSAGE_RECEIVED_SOUND_URL);
        audio.volume = 0.55;
        audio.play().catch(() => {
            playFallbackBeep("received");
        });
    }

    // Bipe sintetizado via Web Audio API, usado como fallback quando o arquivo de
    // áudio real ainda não está disponível ou o autoplay foi bloqueado. Cada "kind"
    // tem um desenho sonoro diferente para não confundir os eventos entre si.
    function playFallbackBeep(kind = "online") {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const now = ctx.currentTime;
            const playTone = (freq, start, dur, type = "sine", peak = 0.28) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + start);
                gain.gain.linearRampToValueAtTime(peak, now + start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now + start);
                osc.stop(now + start + dur + 0.05);
            };
            if (kind === "received") {
                // "tibim": duas notas curtas e agudas
                playTone(880, 0, 0.1);
                playTone(1174.66, 0.09, 0.16);
            } else if (kind === "nudge") {
                // buzz curto e grave, repetido duas vezes
                playTone(180, 0, 0.12, "square", 0.18);
                playTone(180, 0.16, 0.12, "square", 0.18);
            } else {
                // "online": Dó5 -> Sol5, o par de notas clássico
                playTone(523.25, 0, 0.16);
                playTone(783.99, 0.15, 0.24);
            }
            setTimeout(() => ctx.close(), 700);
        } catch (e) { console.warn("Não foi possível tocar o som de notificação:", e); }
    }

    // Bolha flutuante arrastável (usada pelo botão "Voltar à conversa").
    // - Posição inicial: canto inferior direito, mas alguns pixels acima do topo do rodapé,
    //   pra nunca nascer em cima do botão de enviar mensagem do chat.
    // - Arraste via ponteiro (mouse/touch); um toque rápido (sem arrastar) chama onOpen.
    // - A posição escolhida pelo usuário é salva no localStorage e restaurada nas próximas visitas.
    const DraggableBubble = ({ containerRef, storageKey, onOpen, children }) => {
        const bubbleRef = React.useRef(null);
        const [pos, setPos] = React.useState(() => {
            try {
                const saved = localStorage.getItem(storageKey);
                return saved ? JSON.parse(saved) : null;
            } catch (e) { return null; }
        });
        const dragState = React.useRef({ dragging: false, moved: false, offsetX: 0, offsetY: 0 });

        const clampToContainer = React.useCallback((x, y) => {
            const container = containerRef.current;
            const bubble = bubbleRef.current;
            if (!container || !bubble) return { x, y };
            const cRect = container.getBoundingClientRect();
            const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
            const maxX = Math.max(8, cRect.width - bw - 8);
            const maxY = Math.max(8, cRect.height - bh - 8);
            return { x: Math.min(Math.max(8, x), maxX), y: Math.min(Math.max(8, y), maxY) };
        }, [containerRef]);

        // Define a posição padrão (canto inferior direito, acima do rodapé) só na primeira vez,
        // antes da pintura da tela, pra não gerar flicker.
        React.useLayoutEffect(() => {
            if (pos) { setPos(p => clampToContainer(p.x, p.y)); return; }
            const container = containerRef.current;
            const bubble = bubbleRef.current;
            if (!container || !bubble) return;
            const cRect = container.getBoundingClientRect();
            const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
            setPos(clampToContainer(cRect.width - bw - 12, cRect.height - bh - 90));
            // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        const handlePointerDown = (e) => {
            const bubble = bubbleRef.current;
            if (!bubble || !pos) return;
            bubble.setPointerCapture(e.pointerId);
            dragState.current = { dragging: true, moved: false, offsetX: e.clientX - pos.x, offsetY: e.clientY - pos.y };
        };
        const handlePointerMove = (e) => {
            if (!dragState.current.dragging) return;
            dragState.current.moved = true;
            const raw = { x: e.clientX - dragState.current.offsetX, y: e.clientY - dragState.current.offsetY };
            setPos(clampToContainer(raw.x, raw.y));
        };
        const handlePointerUp = () => {
            if (!dragState.current.dragging) return;
            const wasMoved = dragState.current.moved;
            dragState.current.dragging = false;
            if (wasMoved) {
                setPos(prev => { try { localStorage.setItem(storageKey, JSON.stringify(prev)); } catch (e) {} return prev; });
            } else {
                onOpen();
            }
        };

        return (
            <div
                ref={bubbleRef}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerCancel={handlePointerUp}
                className={`absolute z-30 touch-none select-none cursor-grab active:cursor-grabbing ${pos ? "" : "opacity-0"}`}
                style={pos ? { left: pos.x, top: pos.y } : { left: 0, top: 0 }}
            >
                {children}
            </div>
        );
    };


    // Tela de autenticação: login ou cadastro por email/senha.
    // No cadastro, também escolhe nick + avatar, que são salvos em Firestore (users/{uid}).
    const AuthScreen = ({ onAuthed, onSkip, startMode }) => {
        const [mode, setMode] = React.useState(startMode === "signup" ? "signup" : "login"); // "login" | "signup"
        const [email, setEmail] = React.useState("");
        const [password, setPassword] = React.useState("");
        const [nick, setNick] = React.useState("");
        const [selectedAvatar, setSelectedAvatar] = React.useState(null);
        const [loading, setLoading] = React.useState(false);

        const [rememberMe, setRememberMe] = React.useState(true);

        const AUTH_ERROR_MESSAGES = {
            "auth/invalid-email": "Email inválido.",
            "auth/user-not-found": "Não existe conta com esse email.",
            "auth/wrong-password": "Senha incorreta.",
            "auth/invalid-credential": "Email ou senha incorretos.",
            "auth/email-already-in-use": "Já existe uma conta com esse email.",
            "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
        };

        const translateAuthError = (err) => AUTH_ERROR_MESSAGES[err?.code] || "Não foi possível concluir. Tente novamente.";

        const handleSubmit = async () => {
            setErrorMsg("");
            if (!email.trim() || password.length < 6) {
                setErrorMsg("Informe um email válido e uma senha com pelo menos 6 caracteres.");
                return;
            }
            if (mode === "signup" && (nick.trim().length < 2 || !selectedAvatar)) {
                setErrorMsg("Escolha um nick e um avatar para continuar.");
                return;
            }
            if (!(useFirebase && auth && firebaseReady)) {
                setErrorMsg("O Firebase não está configurado neste app.");
                return;
            }
            setLoading(true);
            try {
                if (mode === "signup") {
                    const userCred = await createUserWithEmailAndPassword(auth, email.trim(), password);
                    const uid = userCred.user.uid;
                    await setDoc(doc(db, "users", uid), {
                        nick: nick.trim(),
                        avatar: selectedAvatar,
                        email: email.trim(),
                        createdAt: new Date()
                    }, { merge: true });
                    onAuthed(nick.trim(), selectedAvatar, uid);
                } else {
                    const userCred = await signInWithEmailAndPassword(auth, email.trim(), password);
                    const uid = userCred.user.uid;
                    const snap = await getDoc(doc(db, "users", uid));
                    const data = snap.exists() ? snap.data() : {};
                    onAuthed(data.nick || "Usuário", data.avatar || AVATARS[0], uid);
                }
            } catch (err) {
                console.error("Erro de autenticação:", err);
                setErrorMsg(translateAuthError(err));
            } finally {
                setLoading(false);
            }
        };

        const [googleLoading, setGoogleLoading] = React.useState(false);

        const handleGoogleSignIn = async () => {
            setErrorMsg("");
            if (!(useFirebase && auth && firebaseReady)) {
                setErrorMsg("O Firebase não está configurado neste app.");
                return;
            }
            setGoogleLoading(true);
            try {
                const provider = new GoogleAuthProvider();
                const userCred = await signInWithPopup(auth, provider);
                const uid = userCred.user.uid;
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists()) {
                    const data = snap.data();
                    onAuthed(data.nick || userCred.user.displayName || "Usuário", data.avatar || AVATARS[0], uid);
                } else {
                    const googleNick = (userCred.user.displayName || "Torcedor").slice(0, 24);
                    const googleAvatar = userCred.user.photoURL || AVATARS[0];
                    await setDoc(doc(db, "users", uid), {
                        nick: googleNick,
                        avatar: googleAvatar,
                        email: userCred.user.email || "",
                        createdAt: new Date()
                    }, { merge: true });
                    onAuthed(googleNick, googleAvatar, uid);
                }
            } catch (err) {
                console.error("Erro no login com Google:", err);
                if (err && err.code === "auth/popup-closed-by-user") { setGoogleLoading(false); return; }
                setErrorMsg(translateAuthError(err));
            } finally {
                setGoogleLoading(false);
            }
        };

                            <button onClick={handleSubmit} disabled={loading}

                                <span className="text-[11px] text-gray-400 font-medium tracking-wide">OU CONTINUE COM</span>
                                <div className="flex-1 h-px bg-black/10"></div>

                            <button type="button" className="auth-google-btn" onClick={handleGoogleSignIn} disabled={googleLoading}>

                                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                                </svg>
                                )}
                                {googleLoading ? "AGUARDE..." : "Continuar com Google"}
                            </button>

                            <p className="text-center text-xs text-gray-500 mt-3">
                                {mode === "login" ? "Ainda não tem uma conta? " : "Já tem uma conta? "}
                                <button type="button" onClick={() => { setMode(mode === "login" ? "signup" : "login"); setErrorMsg(""); }}
                                    className="font-semibold text-[#c40000] hover:underline">
                                    {mode === "login" ? "Cadastre-se" : "Entrar"}
                                </button>

                            {onSkip && (
                                <button type="button" onClick={onSkip}
                                    className="auth-skip-link mt-2.5 w-full flex items-center justify-center gap-1.5 text-xs font-semibold">
                                    Continuar sem cadastro <i className="fas fa-arrow-right text-[10px]"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            </main>
        );
    };


    const AvatarPickerModal = ({ currentAvatar, onSelect, onClose }) => {

        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm animate-fade-in">

    // Modal de perfil, aberto ao clicar em um usuário no chat/lista

    // ChatTab com Firebase (realtime) ou localStorage mock
    const ChatTab = ({ nick, avatar, userId, onOpenProfile, isGuest, onRequireSignup }) => {
        const [messages, setMessages] = React.useState([]);
        const [inputMsg, setInputMsg] = React.useState("");
        const [replyTo, setReplyTo] = React.useState(null);
        const chatEndRef = React.useRef(null);
        const scrollToBottom = () => chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
        const scrollToMessage = (id) => {
            const el = document.getElementById(`chatmsg-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                el.classList.add("ring-2", "ring-[hsl(var(--primary))]");
                setTimeout(() => el.classList.remove("ring-2", "ring-[hsl(var(--primary))]"), 1200);
            }
        };
        
        React.useEffect(() => {
            if (useFirebase && db && firebaseReady) {
                // Listener em tempo real no Firestore
                const messagesRef = collection(db, "messages");
                const q = query(messagesRef, orderBy("createdAt", "asc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMessages(loaded);
                    setTimeout(scrollToBottom, 100);
                });
                return () => unsubscribe();
            } else {
                // Mock messages com localStorage
                const stored = localStorage.getItem("socialapp_messages");
                if (stored) setMessages(JSON.parse(stored));
                else {
                    const defaultMsgs = [
                        { id: "1", user: "Sistema", text: "Bem-vindo ao chat global!", time: "12:00", isMe: false, avatar: AVATARS[3], createdAt: Date.now() - 100000 },
                        { id: "2", user: "Ana", text: "Alguém anima um papo?", time: "12:15", isMe: false, avatar: AVATARS[1], createdAt: Date.now() - 50000 },
                        { id: "3", user: nick, text: "Oii, tudo bem?", time: "12:18", isMe: true, avatar: avatar, createdAt: Date.now() }
                    ];
                    setMessages(defaultMsgs);
                    localStorage.setItem("socialapp_messages", JSON.stringify(defaultMsgs));
                }
                setTimeout(scrollToBottom, 100);
            }
        }, []);

        const sendMessage = async () => {
            // Visitante (sem cadastro): não pode enviar mensagens, apenas ler o chat.
            if (isGuest) { onRequireSignup && onRequireSignup(); return; }
            if (!inputMsg.trim()) return;
            const newMsg = {
                user: nick,
                text: inputMsg.trim(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' }),
                isMe: true,
                avatar: avatar,
                createdAt: new Date(),
                userId: userId || "local",
                replyTo: replyTo ? { id: replyTo.id, user: replyTo.user, text: replyTo.text } : null
            };
            if (useFirebase && db) {
                try {
                    await addDoc(collection(db, "messages"), newMsg);
                } catch (err) { console.error("Erro ao enviar mensagem:", err); }
            } else {
                const updated = [...messages, { ...newMsg, id: Date.now().toString() }];
                setMessages(updated);
                localStorage.setItem("socialapp_messages", JSON.stringify(updated));
            }
            setInputMsg("");
            setReplyTo(null);
        };

        // Alterna a reação/curtida em uma mensagem do chat global
        const reactTo = async (msg, emoji) => {
            // Visitante (sem cadastro): não pode reagir/curtir mensagens.
            if (isGuest) { onRequireSignup && onRequireSignup(); return; }
            const myId = userId || "local";
            if (useFirebase && db && msg.id) {
                const msgRef = doc(db, "messages", msg.id);
                await toggleFirestoreReaction(msgRef, msg.reactions, emoji, myId);
            } else {
                const updated = toggleLocalReaction(messages, msg.id, emoji, myId);
                setMessages(updated);
                localStorage.setItem("socialapp_messages", JSON.stringify(updated));
            }
        };

        return (
            <div className="flex flex-col h-full bg-[hsl(var(--app-bg))]">
                {isGuest && (
                    // Aviso fixo: fica visível o tempo todo enquanto a pessoa não se cadastrar.
                    // Não tem botão de fechar de propósito, para não deixar passar despercebido.
                    <button onClick={onRequireSignup} type="button"
                        className="w-full shrink-0 text-left bg-[hsl(var(--primary))] text-white text-xs px-4 py-2.5 flex items-center justify-between gap-3 shadow-md">
                        <span className="flex items-center gap-2">
                            <i className="fas fa-lock"></i>
                            Você precisa se cadastrar para interagir e mandar mensagem no chat.
                        </span>
                        <span className="font-bold underline whitespace-nowrap">
                            Cadastre-se <i className="fas fa-arrow-right text-[10px] ml-0.5"></i>
                        </span>
                    </button>
                )}
                <div className="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
                    {messages.map((msg, idx) => (
                        <div key={msg.id || idx} id={`chatmsg-${msg.id || idx}`} className={`flex rounded-xl transition-shadow ${msg.user === nick ? "justify-end" : "justify-start"}`}>
                            {msg.user !== nick && (
                                <img src={msg.avatar} onClick={() => onOpenProfile && onOpenProfile({ id: msg.userId || msg.user, nick: msg.user, avatar: msg.avatar })}
                                    className="w-8 h-8 rounded-full mr-2 mt-1 object-cover cursor-pointer hover:ring-2 hover:ring-[hsl(var(--primary))] transition" />
                            )}
                            <div className={`max-w-[75%] ${msg.user === nick ? "items-end" : "items-start"} flex flex-col`}>
                                <div className={`rounded-2xl px-4 py-2 shadow-sm ${msg.user === nick ? "bg-[hsl(var(--primary))] text-white rounded-br-sm" : "bg-[hsl(var(--card))] border border-[hsl(var(--border))] rounded-bl-sm"}`}>
                                    {msg.replyTo && (
                                        <div onClick={() => scrollToMessage(msg.replyTo.id)}
                                            className={`mb-1 pl-2 border-l-2 rounded cursor-pointer ${msg.user === nick ? "border-white/60" : "border-[hsl(var(--primary))]"}`}>
                                            <p className={`text-[10px] font-semibold ${msg.user === nick ? "text-white/90" : "text-[hsl(var(--primary))]"}`}>{msg.replyTo.user}</p>
                                            <p className={`text-[11px] truncate max-w-[200px] ${msg.user === nick ? "text-white/70" : "text-[hsl(var(--muted-foreground))]"}`}>{msg.replyTo.text}</p>
                                        </div>
                                    )}
                                    {msg.user !== nick && (
                                        <p onClick={() => onOpenProfile && onOpenProfile({ id: msg.userId || msg.user, nick: msg.user, avatar: msg.avatar })}
                                            className="text-xs font-semibold text-[hsl(var(--primary))] cursor-pointer hover:underline">{msg.user}</p>
                                    )}
                                    <p className="text-sm break-words">{msg.text}</p>
                                    <p className={`text-[10px] mt-1 ${msg.user === nick ? "text-white/70" : "text-[hsl(var(--muted-foreground))]"}`}>{msg.time}</p>
                                </div>
                                <div className={`flex items-center gap-1 mt-1 ${msg.user === nick ? "justify-end" : "justify-start"}`}>
                                    <MessageReactions reactions={msg.reactions} myId={userId || "local"} align={msg.user === nick ? "right" : "left"} onReact={(key) => reactTo(msg, key)} />
                                    <button onClick={() => isGuest ? (onRequireSignup && onRequireSignup()) : setReplyTo(msg)} title="Responder"
                                        className="w-5 h-5 rounded-full bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] text-[10px] text-[hsl(var(--muted-foreground))] flex items-center justify-center hover:bg-[hsl(var(--muted))] hover:text-[hsl(var(--primary))]">
                                        <i className="fas fa-reply"></i>
                                    </button>
                                </div>
                            </div>
                            {msg.user === nick && (
                                <img src={msg.avatar} className="w-8 h-8 rounded-full ml-2 mt-1 object-cover" />
                            )}
                        </div>
                    ))}
                    <div ref={chatEndRef} />
                </div>
                {replyTo && (
                    <div className="px-4 pt-2 flex items-center justify-between bg-[hsl(var(--secondary))] border-t border-[hsl(var(--border))]">
                        <div className="text-xs overflow-hidden py-1.5">
                            <p className="font-semibold text-[hsl(var(--primary))]">Respondendo a {replyTo.user}</p>
                            <p className="truncate text-[hsl(var(--muted-foreground))] max-w-[240px]">{replyTo.text}</p>
                        </div>
                        <button onClick={() => setReplyTo(null)} className="text-[hsl(var(--muted-foreground))] hover:text-[hsl(var(--destructive))] px-2">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                )}
                <div className="p-3 bg-[hsl(var(--panel))] border-t border-[hsl(var(--border))] flex gap-2">
                    <input type="text" value={inputMsg}
                        onChange={(e) => !isGuest && setInputMsg(e.target.value)}
                        onFocus={() => isGuest && onRequireSignup && onRequireSignup()}
                        onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                        readOnly={isGuest}
                        placeholder={isGuest ? "Cadastre-se para enviar mensagens" : "Digite sua mensagem..."}
                        className={`flex-1 bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-[hsl(var(--primary))] ${isGuest ? "cursor-pointer opacity-70" : ""}`} />
                    <button onClick={sendMessage} className="bg-[hsl(var(--primary))] text-white p-2 rounded-full w-10 h-10 flex items-center justify-center hover:opacity-90">
                        <i className={`fas ${isGuest ? "fa-lock" : "fa-paper-plane"}`}></i>
                    </button>
                </div>
            </div>
        );
    };

    // Painel de conversa individual dentro da janela estilo MSN
    const MsnConversationPane = ({ me, other }) => {
        const [messages, setMessages] = React.useState([]);
        const [inputMsg, setInputMsg] = React.useState("");
        const [replyTo, setReplyTo] = React.useState(null);
        const [shaking, setShaking] = React.useState(false);
        const [nudgeCooldown, setNudgeCooldown] = React.useState(false);
        const [otherTyping, setOtherTyping] = React.useState(false);
        const [showEmojiPicker, setShowEmojiPicker] = React.useState(false);
        const endRef = React.useRef(null);
        const isFirstLoad = React.useRef(true);
        const typingThrottleRef = React.useRef(0);
        const otherTypingTimeoutRef = React.useRef(null);
        const chatId = pairId(me.userId || me.nick, other.id);
        const myId = me.userId || me.nick;
        const scrollToBottom = () => endRef.current?.scrollIntoView({ behavior: "smooth" });
        const scrollToMessage = (id) => {
            const el = document.getElementById(`dmmsg-${chatId}-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                el.classList.add("ring-2", "ring-[hsl(var(--primary))]", "rounded-lg");
                setTimeout(() => el.classList.remove("ring-2", "ring-[hsl(var(--primary))]", "rounded-lg"), 1200);
            }
        };

        React.useEffect(() => {
            isFirstLoad.current = true;
            if (useFirebase && db && me.userId) {
                const msgsRef = collection(db, "private_chats", chatId, "messages");
                const q = query(msgsRef, orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    // Se o outro contato acabou de mandar um "Chamar Atenção" ou uma mensagem nova,
                    // tocamos o som certo e (no caso do nudge) tremem a janela também do nosso lado —
                    // igual ao MSN clássico. Também pisca o título da aba se ela não estiver em foco.
                    if (!isFirstLoad.current) {
                        snap.docChanges().forEach(change => {
                            if (change.type === "added") {
                                const data = change.doc.data();
                                if (data.senderId === myId) return;
                                if (data.nudge) {
                                    playAttentionSound();
                                    setShaking(true);
                                    setTimeout(() => setShaking(false), 820);
                                    if (document.hidden) startTitleFlash("📢 Chamando atenção!");
                                } else {
                                    playMessageReceivedSound();
                                    if (document.hidden) startTitleFlash("💬 Nova mensagem!");
                                }
                            }
                        });
                    }
                    isFirstLoad.current = false;
                    setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setTimeout(scrollToBottom, 80);
                });
                return () => unsub();
            } else {
                const stored = localStorage.getItem(`dm_${chatId}`);
                setMessages(stored ? JSON.parse(stored) : []);
                setTimeout(scrollToBottom, 80);
            }
        }, [chatId]);

        // Indicador "Fulano está digitando...": escuta o campo typing[otherId] salvo no
        // documento pai da conversa (private_chats/{chatId}). Se o timestamp for recente
        // (menos de 3s), mostramos o indicador; senão, ele expira sozinho.
        React.useEffect(() => {
            if (!(useFirebase && db && me.userId)) return;
            const convoRef = doc(db, "private_chats", chatId);
            const unsub = onSnapshot(convoRef, (snap) => {
                const data = snap.data();
                const otherTs = data && data.typing ? data.typing[other.id] : null;
                if (otherTypingTimeoutRef.current) clearTimeout(otherTypingTimeoutRef.current);
                if (otherTs && Date.now() - otherTs < 3000) {
                    setOtherTyping(true);
                    otherTypingTimeoutRef.current = setTimeout(() => setOtherTyping(false), 3000 - (Date.now() - otherTs));
                } else {
                    setOtherTyping(false);
                }
            });
            return () => { unsub(); if (otherTypingTimeoutRef.current) clearTimeout(otherTypingTimeoutRef.current); };
        }, [chatId]);

        // Avisa ao outro contato que estou digitando, com throttle de ~1.2s para não
        // encher o Firestore de escritas a cada tecla.
        const notifyTyping = () => {
            if (!(useFirebase && db && me.userId)) return;
            const now = Date.now();
            if (now - typingThrottleRef.current < 1200) return;
            typingThrottleRef.current = now;
            setDoc(doc(db, "private_chats", chatId), { typing: { [myId]: now } }, { merge: true }).catch(() => {});
        };

        const send = async () => {
            if (!inputMsg.trim()) return;
            const newMsg = {
                senderId: myId,
                senderNick: me.nick,
                text: inputMsg.trim(),
                time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                createdAt: new Date(),
                nameColor: getMyNameColor(),
                textColor: getMyTextColor(),
                replyTo: replyTo ? { id: replyTo.id, user: replyTo.senderNick, text: replyTo.text } : null
            };
            if (useFirebase && db && me.userId) {
                try { await addDoc(collection(db, "private_chats", chatId, "messages"), newMsg); }
                catch (err) { console.error("Erro ao enviar DM:", err); }
                setDoc(doc(db, "private_chats", chatId), { typing: { [myId]: 0 } }, { merge: true }).catch(() => {});
            } else {
                const updated = [...messages, { ...newMsg, id: Date.now().toString() }];
                setMessages(updated);
                localStorage.setItem(`dm_${chatId}`, JSON.stringify(updated));
            }
            setInputMsg("");
            setReplyTo(null);
            setShowEmojiPicker(false);
            setTimeout(scrollToBottom, 80);
        };

        // "Chamar Atenção" clássico do MSN: toca o som, treme a janela e registra
        // uma mensagem de sistema na conversa avisando que a atenção foi chamada.
        // Tem um cooldown de 10s pra não dar pra ficar chacoalhando o outro sem parar.
        const NUDGE_COOLDOWN_MS = 10000;
        const sendNudge = async () => {
            if (nudgeCooldown) return;
            setNudgeCooldown(true);
            setTimeout(() => setNudgeCooldown(false), NUDGE_COOLDOWN_MS);

            playAttentionSound();
            setShaking(true);
            setTimeout(() => setShaking(false), 820);

            const nudgeMsg = {
                senderId: myId,
                senderNick: me.nick,
                text: `${me.nick.split(" ")[0]} chamou a sua atenção!`,
                time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                createdAt: new Date(),
                nudge: true,
                replyTo: null
            };
            if (useFirebase && db && me.userId) {
                try { await addDoc(collection(db, "private_chats", chatId, "messages"), nudgeMsg); }
                catch (err) { console.error("Erro ao enviar chamada de atenção:", err); }
            } else {
                const updated = [...messages, { ...nudgeMsg, id: Date.now().toString() }];
                setMessages(updated);
                localStorage.setItem(`dm_${chatId}`, JSON.stringify(updated));
            }
            setTimeout(scrollToBottom, 80);
        };

        // Alterna a reação/curtida em uma mensagem privada
        const reactTo = async (m, emoji) => {
            const myId = me.userId || me.nick;
            if (useFirebase && db && me.userId && m.id) {
                const msgRef = doc(db, "private_chats", chatId, "messages", m.id);
                await toggleFirestoreReaction(msgRef, m.reactions, emoji, myId);
            } else {
                const updated = toggleLocalReaction(messages, m.id, emoji, myId);
                setMessages(updated);
                localStorage.setItem(`dm_${chatId}`, JSON.stringify(updated));
            }
        };

        // Insere um emoticon do painel visual diretamente no campo de texto
        const insertEmoji = (emoji) => setInputMsg(prev => prev + emoji);

        return (
            <div className={`flex flex-col h-full bg-[repeating-linear-gradient(135deg,hsl(140,35%,96%)_0px,hsl(140,35%,96%)_40px,hsl(140,30%,93%)_40px,hsl(140,30%,93%)_80px)] dark:bg-[hsl(140,20%,12%)] ${shaking ? "msn-nudge-shake" : ""}`}>
                {/* Cabeçalho estilo MSN: foto grande + nome + status */}
                <div className="flex items-start gap-3 px-4 py-3 shrink-0">
                    <MsnAvatar src={other.avatar} size={64} status={other.presenceStatus === "busy" ? "busy" : "online"} />
                    <div className="pt-0.5 flex-1 min-w-0">
                        <p className="text-base font-bold text-[hsl(var(--foreground))] flex items-center gap-1.5">
                            {other.nick} <i className="fas fa-star text-yellow-400 text-xs"></i> <i className="fas fa-gamepad text-[hsl(var(--primary))] text-xs"></i>
                            <span className={`text-sm font-normal ${other.presenceStatus === "busy" ? "text-red-500" : "text-[hsl(var(--muted-foreground))]"}`}>({other.presenceStatus === "busy" ? "Ocupado" : "Disponível"})</span>
                        </p>
                        <p className="text-xs text-[hsl(var(--muted-foreground))] mt-0.5 min-h-[16px]">
                            {otherTyping ? (
                                <span className="text-emerald-600 dark:text-emerald-400 font-medium">
                                    <i className="fas fa-pen-nib mr-1"></i>{other.nick.split(" ")[0]} está digitando...
                                </span>
                            ) : "Diga oi e comece a conversar 👋"}
                        </p>
                    </div>
                    <button onClick={sendNudge} title={nudgeCooldown ? "Aguarde um pouco antes de chamar atenção de novo" : "Chamar Atenção"}
                        disabled={nudgeCooldown}
                        className={`shrink-0 w-9 h-9 rounded-full border flex items-center justify-center transition ${nudgeCooldown ? "bg-gray-100 dark:bg-gray-800/40 border-gray-300 dark:border-gray-700 text-gray-400 cursor-not-allowed" : "bg-amber-100 dark:bg-amber-900/40 border-amber-300 dark:border-amber-700 text-amber-600 dark:text-amber-400 hover:bg-amber-200 dark:hover:bg-amber-800/50 active:scale-90"}`}>
                        <i className="fas fa-bullhorn text-sm"></i>
                    </button>
                </div>
                <div className="mx-4 mb-2 px-3 py-1.5 bg-white/70 dark:bg-black/20 rounded-md text-[11px] text-[hsl(var(--muted-foreground))] flex items-center justify-between shrink-0">
                    <span>Você está conversando com {other.nick.split(" ")[0]}</span>
                </div>
                <div className="flex-1 overflow-y-auto px-4 py-2 space-y-2.5 no-scrollbar">
                    {messages.length === 0 && (
                        <p className="text-xs text-center text-[hsl(var(--muted-foreground))] mt-6">Diga oi para {other.nick.split(" ")[0]}! 👋</p>
                    )}
                    {messages.map((m, idx) => {
                        const mine = m.senderId === myId;
                        if (m.nudge) {
                            return (
                                <div key={m.id || idx} id={`dmmsg-${chatId}-${m.id || idx}`}
                                    className="text-center text-[11px] italic text-amber-700 dark:text-amber-400 py-1">
                                    <i className="fas fa-bullhorn mr-1"></i>{m.text}
                                </div>
                            );
                        }
                        const nameColor = m.nameColor || "";
                        return (
                            <div key={m.id || idx} id={`dmmsg-${chatId}-${m.id || idx}`} className="text-sm leading-snug transition-shadow">
                                <span className={`font-semibold ${!nameColor ? (mine ? "text-[hsl(var(--primary))]" : "text-emerald-700 dark:text-emerald-400") : ""}`}
                                    style={nameColor ? { color: nameColor } : undefined}>
                                    {mine ? me.nick : other.nick} diz:
                                </span>
                                <br />
                                {m.replyTo && (
                                    <div onClick={() => scrollToMessage(m.replyTo.id)}
                                        className="my-1 pl-2 border-l-2 border-[hsl(var(--primary))] cursor-pointer">
                                        <p className="text-[10px] font-semibold text-[hsl(var(--primary))]">{m.replyTo.user}</p>
                                        <p className="text-[11px] text-[hsl(var(--muted-foreground))] truncate max-w-[240px]">{m.replyTo.text}</p>
                                    </div>
                                )}
                                <span className="text-[hsl(var(--foreground))] break-words" style={m.textColor ? { color: m.textColor } : undefined}>
                                    {renderMsnText(m.text)}
                                </span>
                                <div className="flex items-center gap-1 mt-1">
                                    <MessageReactions reactions={m.reactions} myId={me.userId || me.nick} align={mine ? "right" : "left"} onReact={(key) => reactTo(m, key)} />
                                    <button onClick={() => setReplyTo(m)} title="Responder"
                                        className="w-5 h-5 rounded-full bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] text-[10px] text-[hsl(var(--muted-foreground))] flex items-center justify-center hover:bg-[hsl(var(--muted))] hover:text-[hsl(var(--primary))]">
                                        <i className="fas fa-reply"></i>
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                    <div ref={endRef} />
                </div>
                {replyTo && (
                    <div className="mx-4 mb-2 px-3 py-1.5 bg-white/70 dark:bg-black/20 rounded-md text-[11px] flex items-center justify-between shrink-0">
                        <div className="overflow-hidden">
                            <p className="font-semibold text-[hsl(var(--primary))]">Respondendo a {replyTo.senderNick}</p>
                            <p className="truncate text-[hsl(var(--muted-foreground))] max-w-[240px]">{replyTo.text}</p>
                        </div>
                        <button onClick={() => setReplyTo(null)} className="text-[hsl(var(--muted-foreground))] hover:text-[hsl(var(--destructive))] px-2">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                )}
                {/* Painel visual de emoticons clássicos do MSN */}
                {showEmojiPicker && (
                    <div className="mx-4 mb-2 p-2 bg-white dark:bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-xl shrink-0 grid grid-cols-7 gap-1">
                        {MSN_EMOTICONS.map((e, i) => (
                            <button key={i} onClick={() => insertEmoji(e.emoji)} title={`${e.label} (${e.code})`}
                                className="w-8 h-8 flex items-center justify-center text-lg rounded-lg hover:bg-[hsl(var(--muted))] active:scale-90 transition">
                                {e.emoji}
                            </button>
                        ))}
                    </div>
                )}
                {/* Rodapé estilo MSN: minha foto grande + campo de mensagem */}
                <div className="p-3 border-t border-[hsl(var(--border))] bg-[hsl(var(--panel))] flex items-end gap-2 shrink-0">
                    <MsnAvatar src={me.avatar} size={56} status={me.presenceStatus === "busy" ? "busy" : "online"} />
                    <div className="flex-1 flex flex-col gap-1.5">
                        <div className="flex-1 flex items-center gap-2 bg-white dark:bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-xl px-3 py-2">
                            <input type="text" value={inputMsg}
                                onChange={(e) => { setInputMsg(e.target.value); notifyTyping(); }}
                                onKeyPress={(e) => e.key === "Enter" && send()}
                                placeholder="Digite uma mensagem..."
                                className="flex-1 bg-transparent text-sm focus:outline-none" />
                            <i onClick={() => setShowEmojiPicker(o => !o)}
                                className={`fas fa-smile cursor-pointer transition ${showEmojiPicker ? "text-amber-500 scale-110" : "text-[hsl(var(--primary))]"}`}></i>
                        </div>
                        <div className="flex justify-end">
                            <button onClick={send} className="bg-[hsl(var(--primary))] text-white px-4 py-1.5 rounded-lg text-xs font-semibold hover:opacity-90">
                                Enviar <i className="fas fa-paper-plane ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // Janela de conversa estilo MSN: ocupa a área do conteúdo (como uma "aba" por cima do chat),
    // com abas para cada conversa aberta e um botão de minimizar para voltar ao app
    const MsnChatWindow = ({ me, openChats, activeChatId, setActiveChatId, onCloseTab, onCloseAll, onMinimize }) => {
        if (openChats.length === 0) return null;
        const activeChat = openChats.find(c => c.id === activeChatId) || openChats[0];

        return (
            <div className="absolute inset-0 z-30 bg-[hsl(var(--card))] flex flex-col animate-slide-up">
                {/* Barra de título estilo MSN — cor/gradiente segue o tema escolhido nas Configurações */}
                <div className="text-white px-3 py-2 flex items-center justify-between shrink-0"
                    style={{ background: "linear-gradient(90deg, hsl(var(--chat-window-primary)), hsl(var(--chat-window-primary) / 0.72))" }}>
                    <span className="text-xs font-bold"><i className="fas fa-comments mr-1.5"></i>Conversas ({openChats.length})</span>
                    <div className="flex items-center gap-2">
                        <button onClick={onMinimize} className="w-7 h-7 rounded hover:bg-white/20 flex items-center justify-center" title="Minimizar e voltar pro chat">
                            <i className="fas fa-chevron-down text-xs"></i>
                        </button>
                        <button onClick={onCloseAll} className="w-7 h-7 rounded hover:bg-white/20 flex items-center justify-center" title="Fechar todas as conversas">
                            <i className="fas fa-times text-sm"></i>
                        </button>
                    </div>
                </div>
                {/* Abas das conversas abertas */}

    const SocialApp = ({ nick, avatar, userId, onUpdateAvatar, onLogout, isGuest, onRequireSignup }) => {

        const bannerTimer = React.useRef(null);

        // ===== Amigos / solicitações / janelas de chat estilo MSN =====
        const [friends, setFriends] = React.useState(useFirebase ? [] : MOCK_CONTACTS);
        const [incomingRequests, setIncomingRequests] = React.useState([]);
        const [outgoingIds, setOutgoingIds] = React.useState([]);
        const [profileUser, setProfileUser] = React.useState(null);
        const [openChats, setOpenChats] = React.useState([]);
        const [activeChatId, setActiveChatId] = React.useState(null);
        const [chatMinimized, setChatMinimized] = React.useState(false);
        const contentAreaRef = React.useRef(null); // usado para limitar o arraste da bolha "Voltar à conversa"
        const [statusMsg, setStatusMsg] = React.useState(() => localStorage.getItem("socialapp_status") || "Compartilhe uma mensagem rápida");
        // Status de presença escolhido pelo usuário: "online" (Disponível) ou "busy" (Ocupado)
        const [myPresence, setMyPresence] = React.useState(() => localStorage.getItem("socialapp_presence") || "online");

        React.useEffect(() => {
            if (useFirebase && db && userId) {
                getDoc(doc(db, "users", userId)).then(snap => {
                    if (snap.exists()) {
                        if (snap.data().statusMsg) setStatusMsg(snap.data().statusMsg);
                        if (snap.data().presenceStatus) setMyPresence(snap.data().presenceStatus);
                    }
                }).catch(err => console.error("Erro ao carregar status:", err));
            }
        }, [userId]);

        const handleUpdateStatusMsg = (newMsg) => {
            const trimmed = (newMsg || "").trim() || "Compartilhe uma mensagem rápida";
            setStatusMsg(trimmed);
            localStorage.setItem("socialapp_status", trimmed);
            if (useFirebase && db && userId) {
                setDoc(doc(db, "users", userId), { statusMsg: trimmed }, { merge: true }).catch(err => console.error("Erro ao salvar status:", err));
            }
        };

        // Troca o status de presença (Disponível/Ocupado), refletindo na moldura verde/vermelha do avatar
        const handleChangePresence = (newPresence) => {
            setMyPresence(newPresence);
            localStorage.setItem("socialapp_presence", newPresence);
            if (useFirebase && db && userId) {
                setDoc(doc(db, "users", userId), { presenceStatus: newPresence }, { merge: true }).catch(err => console.error("Erro ao salvar presença:", err));
            }
        };

        // ===== Pop-up "Fulano acabou de entrar" (estilo MSN) + som =====
        const [toasts, setToasts] = React.useState([]);
        const TOAST_VISIBLE_MS = 4000;   // tempo visível antes de iniciar o slide-out
        const TOAST_EXIT_MS = 350;       // duração da animação de saída (bate com .animate-toast-out)
        const showSignInToast = (person, text, status = "online") => {
            const id = Date.now() + Math.random();
            setToasts(prev => [...prev, { id, nick: person.nick, avatar: person.avatar, text, status, leaving: false }]);
            playNotificationSound();
            // Após 4s, marca como "saindo" (dispara o slide-out) e só então remove do DOM
            setTimeout(() => {
                setToasts(prev => prev.map(t => (t.id === id ? { ...t, leaving: true } : t)));
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), TOAST_EXIT_MS);
            }, TOAST_VISIBLE_MS);
        };
        const dismissToast = (id) => {
            setToasts(prev => prev.map(t => (t.id === id ? { ...t, leaving: true } : t)));
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), TOAST_EXIT_MS);
        };

        // Avisa que EU acabei de entrar (aparece pra mim mesmo, como confirmação de login)
        React.useEffect(() => {
            const t = setTimeout(() => showSignInToast({ nick, avatar }, "acabou de entrar", myPresence), 900);
            return () => clearTimeout(t);
            // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        // Marca meu status online/offline no Firestore (presença)
        React.useEffect(() => {
            if (!(useFirebase && db && userId)) return;
            const myRef = doc(db, "users", userId);
            setDoc(myRef, { online: true, lastSeen: new Date() }, { merge: true }).catch(() => {});
            const handleVisibility = () => {
                setDoc(myRef, { online: document.visibilityState === "visible", lastSeen: new Date() }, { merge: true }).catch(() => {});
            };
            const handleUnload = () => { setDoc(myRef, { online: false, lastSeen: new Date() }, { merge: true }).catch(() => {}); };
            document.addEventListener("visibilitychange", handleVisibility);
            window.addEventListener("beforeunload", handleUnload);
            return () => {
                document.removeEventListener("visibilitychange", handleVisibility);
                window.removeEventListener("beforeunload", handleUnload);
                setDoc(myRef, { online: false, lastSeen: new Date() }, { merge: true }).catch(() => {});
            };
        }, [userId]);

        // Escuta quando um AMIGO fica online e mostra o pop-up + som pra mim
        const friendOnlineRef = React.useRef({});
        React.useEffect(() => {
            if (!(useFirebase && db) || friends.length === 0) return;
            const unsubs = friends.map(friend => onSnapshot(doc(db, "users", friend.id), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                const isOnline = !!data.online;
                const presence = data.presenceStatus === "busy" ? "busy" : "online";
                const wasOnline = friendOnlineRef.current[friend.id];
                if (isOnline && wasOnline === false) {
                    showSignInToast({ nick: data.nick || friend.nick, avatar: data.avatar || friend.avatar }, "acabou de entrar", presence);
                }
                friendOnlineRef.current[friend.id] = isOnline;
                setFriends(prev => prev.map(f => f.id === friend.id
                    ? { ...f, status: isOnline ? "Online" : "Offline", presenceStatus: presence, nick: data.nick || f.nick, avatar: data.avatar || f.avatar }
                    : f));
            }));
            return () => unsubs.forEach(u => u());
            // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [friends.map(f => f.id).join(",")]);

        React.useEffect(() => {
            if (!(useFirebase && db && userId)) return;
            // Amizades confirmadas
            const friendshipsQ = query(collection(db, "friendships"), where("users", "array-contains", userId));
            const unsubFriendships = onSnapshot(friendshipsQ, async (snap) => {
                const others = snap.docs.map(d => d.data().users.find(u => u !== userId)).filter(Boolean);
                const loaded = [];
                for (const uid of others) {
                    try {
                        const uSnap = await getDoc(doc(db, "users", uid));
                        if (uSnap.exists()) loaded.push({
                            id: uid, nick: uSnap.data().nick, avatar: uSnap.data().avatar,
                            status: uSnap.data().online ? "Online" : "Offline",
                            presenceStatus: uSnap.data().presenceStatus === "busy" ? "busy" : "online",
                        });
                    } catch (e) { console.error(e); }
                }
                setFriends(loaded);
            });
            // Solicitações recebidas pendentes
            const incomingQ = query(collection(db, "friend_requests"), where("to", "==", userId), where("status", "==", "pending"));
            const unsubIncoming = onSnapshot(incomingQ, (snap) => {
                setIncomingRequests(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
            // Solicitações enviadas pendentes (pra desabilitar botão)
            const outgoingQ = query(collection(db, "friend_requests"), where("from", "==", userId), where("status", "==", "pending"));
            const unsubOutgoing = onSnapshot(outgoingQ, (snap) => {
                setOutgoingIds(snap.docs.map(d => d.data().to));
            });
            return () => { unsubFriendships(); unsubIncoming(); unsubOutgoing(); };
        }, [userId]);

        const getRelation = (user) => {
            if (!user) return "none";
            if (user.id === userId || user.nick === nick) return "self";
            // Sem Firebase configurado, o app funciona em modo demo: qualquer perfil já pode receber mensagem
            if (!useFirebase) return "friend";
            if (friends.some(f => f.id === user.id)) return "friend";
            if (incomingRequests.some(r => r.from === user.id)) return "received";
            if (outgoingIds.includes(user.id)) return "sent";
            return "none";
        };

        const handleSendRequest = async (user) => {
            if (!(useFirebase && db && userId)) { setProfileUser(null); return; }
            try {
                await setDoc(doc(db, "friend_requests", pairId(userId, user.id)), {
                    from: userId, to: user.id, fromNick: nick, fromAvatar: avatar,
                    toNick: user.nick, toAvatar: user.avatar, status: "pending", createdAt: new Date()
                });
            } catch (err) { console.error("Erro ao enviar solicitação:", err); }
        };

        const handleRespondRequest = async (user, accept) => {
            if (!(useFirebase && db && userId)) return;
            try {
                const reqId = pairId(userId, user.id);
                await setDoc(doc(db, "friend_requests", reqId), { status: accept ? "accepted" : "declined" }, { merge: true });
                if (accept) {
                    await setDoc(doc(db, "friendships", reqId), { users: [userId, user.id], createdAt: new Date() }, { merge: true });
                }
            } catch (err) { console.error("Erro ao responder solicitação:", err); }
        };

        const handleOpenChat = (user) => {
            setOpenChats(prev => prev.find(c => c.id === user.id) ? prev : [...prev, user]);
            setActiveChatId(user.id);
            setChatMinimized(false);
        };
        const handleCloseTab = (id) => {
            setOpenChats(prev => {
                const next = prev.filter(c => c.id !== id);
                if (activeChatId === id) setActiveChatId(next.length ? next[0].id : null);
                return next;
            });
        };
        const handleCloseAllChats = () => { setOpenChats([]); setActiveChatId(null); };

        const ADVERTISERS = [
            { name: "🔥 Loja Tech — Ofertas relâmpago!", link: "#" },
            { name: "📚 Cursos Online — 30% OFF hoje!", link: "#" },
            { name: "🎮 Promoção Games — Até 50% OFF!", link: "#" },
            { name: "⭐ Assine o Premium agora!", link: "#" }
        ];
        React.useEffect(() => {
            bannerTimer.current = setInterval(() => {
                setBannerVisible(false);
                setTimeout(() => {
                    setBannerIndex((prev) => (prev + 1) % ADVERTISERS.length);
                    setBannerVisible(true);
                }, 400);
            }, 5000);
            return () => clearInterval(bannerTimer.current);
        }, []);
        const currentAd = ADVERTISERS[bannerIndex];
        const navItems = [
            { id: "chat", icon: "fa-comment", label: "Chat" },
            { id: "contacts", icon: "fa-users", label: "Contatos" },
            { id: "store", icon: "fa-store", label: "Loja" },
            { id: "more", icon: "fa-ellipsis-h", label: "Mais" }
        ];
        return (
            <div className="flex flex-col h-full w-full bg-[hsl(var(--app-bg))]">
                <ToastContainer toasts={toasts} onDismiss={dismissToast} />
                <div ref={contentAreaRef} className="flex-1 overflow-hidden relative">
                    {activeTab === "chat" && <ChatTab nick={nick} avatar={avatar} userId={userId} onOpenProfile={(u) => setProfileUser(u)} isGuest={isGuest} onRequireSignup={onRequireSignup} />}
                    {activeTab === "contacts" && <ContactsTab nick={nick} avatar={avatar} friends={friends} incomingRequests={incomingRequests} onOpenProfile={(u) => setProfileUser(u)} onOpenChat={handleOpenChat} onEditProfile={() => setShowAvatarPicker(true)} statusMsg={statusMsg} onUpdateStatusMsg={handleUpdateStatusMsg} presence={myPresence} onChangePresence={handleChangePresence} />}
                    {activeTab === "store" && <StoreTab />}
                    {activeTab === "more" && <MoreTab nick={nick} avatar={avatar} onEditProfile={() => setShowAvatarPicker(true)} onLogout={onLogout} isGuest={isGuest} onRequireSignup={onRequireSignup} />}

                    {openChats.length > 0 && !chatMinimized && (
                        <MsnChatWindow
                            me={{ nick, avatar, userId, presenceStatus: myPresence }}
                            openChats={openChats}
                            activeChatId={activeChatId}
                            setActiveChatId={setActiveChatId}
                            onCloseTab={handleCloseTab}
                            onCloseAll={handleCloseAllChats}
                            onMinimize={() => setChatMinimized(true)}
                        />
                    )}
                    {openChats.length > 0 && chatMinimized && (
                        <DraggableBubble containerRef={contentAreaRef} storageKey="socialapp_bubble_pos" onOpen={() => setChatMinimized(false)}>
                            <div className="bg-[hsl(var(--primary))] text-white rounded-full shadow-xl pl-3 pr-4 py-2.5 flex items-center gap-2 hover:opacity-90">
                                <span className="relative">
                                    <i className="fas fa-comment-dots"></i>
                                    <span className="absolute -top-1 -right-1.5 bg-red-500 text-white text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center">{openChats.length}</span>
                                </span>
                                <span className="text-xs font-semibold whitespace-nowrap">Voltar à conversa</span>
                            </div>
                        </DraggableBubble>
                    )}
                </div>
                {profileUser && (
                    <ProfileModal
                        user={profileUser}
                        relation={getRelation(profileUser)}
                        onSendRequest={handleSendRequest}
                        onRespondRequest={handleRespondRequest}
                        onOpenChat={handleOpenChat}
                        onClose={() => setProfileUser(null)}
                    />
                )}
                <nav className="app-bottom-nav nav-glass flex justify-around items-center px-2 py-1 shrink-0">
                    {navItems.map(({ id, icon, label }) => (
                        <button key={id} onClick={() => { setActiveTab(id); if (openChats.length > 0) setChatMinimized(true); }}
                            className={`flex flex-col items-center gap-0.5 px-4 py-2 rounded-2xl transition-all ${activeTab === id ? "text-[hsl(var(--primary))]" : "text-[hsl(var(--muted-foreground))] hover:text-[hsl(var(--foreground))]"}`}>
                            <div className={`relative ${activeTab === id ? "scale-110" : ""} transition-transform`}>
                                <i className={`fas ${icon} text-xl`}></i>
                                {activeTab === id && <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[hsl(var(--primary))]" />}
                            </div>
                            <span className={`text-[10px] font-medium ${activeTab === id ? "text-[hsl(var(--primary))]" : ""}`}>{label}</span>
                        </button>
                    ))}
                </nav>
                {showAvatarPicker && (
                    <AvatarPickerModal currentAvatar={avatar} onSelect={(newAvatar) => {
                        onUpdateAvatar(newAvatar);
                        if (useFirebase && userId) {
                            // Atualizar avatar no Firestore
                            const userRef = doc(db, "users", userId);
                            setDoc(userRef, { avatar: newAvatar }, { merge: true });
                        } else {
                            saveProfileLocally(nick, newAvatar);
                        }
                    }} onClose={() => setShowAvatarPicker(false)} />
                )}
            </div>
        );
    };

    const Index = () => {
        const [nick, setNick] = React.useState("");
        const [avatar, setAvatar] = React.useState("");
        const [userId, setUserId] = React.useState(null);
        const [ready, setReady] = React.useState(false);
        const [checkingSession, setCheckingSession] = React.useState(true);
        // Marca se o usuário atual entrou pela opção "Continuar sem cadastro".
        // Enquanto isGuest for true, o chat fica em modo somente-leitura.
        const [isGuest, setIsGuest] = React.useState(false);
        // Controla em qual aba (login/cadastro) a AuthScreen deve abrir quando
        // o visitante clicar no aviso fixo pedindo para se cadastrar.
        const [authStartMode, setAuthStartMode] = React.useState("login");

        React.useEffect(() => {
            if (useFirebase && auth && firebaseReady) {
                // Login com email/senha: o Firebase Auth mantém a sessão automaticamente.
                // onAuthStateChanged dispara assim que o app carrega, se já houver login salvo.
                const unsub = onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        try {
                            const snap = await getDoc(doc(db, "users", user.uid));
                            const data = snap.exists() ? snap.data() : {};
                            setNick(data.nick || "Usuário");
                            setAvatar(data.avatar || AVATARS[0]);
                            setUserId(user.uid);
                            setReady(true);
                        } catch (err) {
                            console.error("Erro ao carregar perfil:", err);
                        }
                    } else {
                        setNick(""); setAvatar(""); setUserId(null); setReady(false);
                    }
                    setCheckingSession(false);
                });
                return () => unsub();
            } else {
                // Modo sem Firebase: mantém compatibilidade com o fallback local antigo
                const local = loadProfileLocally();
                if (local.nick && local.avatar) {
                    setNick(local.nick);
                    setAvatar(local.avatar);
                    setReady(true);
                }
                setCheckingSession(false);
            }
        }, []);

        const handleAuthed = (chosenNick, chosenAvatar, uid, guest = false) => {
            setNick(chosenNick);
            setAvatar(chosenAvatar);
            setUserId(uid);
            setReady(true);
            // Só é "visitante" quando handleSkipAuth pede isso explicitamente (guest=true).
            // Login/cadastro reais (que não passam esse 4º argumento) sempre limpam o modo visitante.
            setIsGuest(guest);
        };

        // Permite fechar a tela de cadastro/login e continuar navegando sem conta.
        // Quem entra por aqui é marcado como "visitante" (isGuest = true) e só poderá
        // ler as mensagens do chat, sem curtir, reagir ou enviar mensagens.
        const handleSkipAuth = () => {
            handleAuthed("Visitante", AVATARS[Math.floor(Math.random() * AVATARS.length)], null, true);
        };

        // Chamado quando o visitante clica no aviso fixo do chat ("Cadastre-se").
        // Leva de volta à tela de autenticação já na aba "CADASTRAR".
        const handleRequireSignup = () => {
            setAuthStartMode("signup");
            setReady(false);
        };

        const handleUpdateAvatar = (newAvatar) => {
            setAvatar(newAvatar);
            if (useFirebase && userId) {
                const userRef = doc(db, "users", userId);
                setDoc(userRef, { avatar: newAvatar }, { merge: true });
            } else {
                saveProfileLocally(nick, newAvatar);
            }
        };

        const handleLogout = async () => {
            if (useFirebase && auth) {
                try { await signOut(auth); } catch (err) { console.error("Erro ao sair:", err); }
            }
            clearProfileLocally();
            setNick("");
            setAvatar("");
            setUserId(null);
            setReady(false);
            setIsGuest(false);
            setAuthStartMode("login");
        };

        if (checkingSession) {
            return (
                <div className="w-full h-full flex items-center justify-center bg-[hsl(var(--app-bg))]">
                    <i className="fas fa-circle-notch fa-spin text-2xl text-[hsl(var(--primary))]"></i>
                </div>
            );
        }

        return (
            <div className="w-full h-full bg-[hsl(var(--app-bg))]">
                {ready ? (
                    <SocialApp nick={nick} avatar={avatar} userId={userId} onUpdateAvatar={handleUpdateAvatar} onLogout={handleLogout} isGuest={isGuest} onRequireSignup={handleRequireSignup} />
                ) : (
                    <AuthScreen onAuthed={handleAuthed} onSkip={handleSkipAuth} startMode={authStartMode} />
                )}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<Index />);
</script>
</body>
</html>
