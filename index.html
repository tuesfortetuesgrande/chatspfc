<script>
  // ============================================================
  // SERVICE WORKER INLINE (via Blob) - offline cache e instalação
  // ============================================================
  (function registerSW() {
    // Cria o código do service worker como string
    const swCode = `
      self.addEventListener('install', e => {
        e.waitUntil(
          caches.open('tricolor-chat-v1').then(cache => {
            return cache.addAll([
              '/',
              '/index.html'
            ]);
          })
        );
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(res => res || fetch(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(swUrl)
        .then(reg => console.log('✅ SW registrado:', reg))
        .catch(err => console.warn('⚠️ SW não registrado:', err));
    }
  })();
</script>

  :root{

    --popover:#ffffff;

    /* Chat — leve textura estilo WhatsApp */
    --chat-bg:#eae6df;
    --bubble-me:#dcf8c6;         /* verdinho tipo WhatsApp para "eu" */
    --bubble-me-fg:#0b141a;

  }
  .dark{

    --secondary:#1f2c33;
    --secondary-foreground:#e9edef;
    --popover:#111b21;
    --popover-foreground:#e9edef;
    --chat-bg:#0a1014;
    --bubble-me:#005c4b;
    --bubble-me-fg:#e9edef;
    --bubble-other:#202c33;
    --bubble-other-fg:#e9edef;
    --shadow-bubble:0 1px 1.5px rgba(0,0,0,.35);
    --shadow-card:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-header:0 1px 0 rgba(255,255,255,.04);
  }

  /* Tipografia estilo iOS/SF, com fallback Inter-like */
  *{
    box-shadow:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  html,body{ text-rendering:optimizeLegibility; }
  body{
    background-color:var(--background);
    color:var(--foreground);
    transition:background-color .25s ease,color .25s ease;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* Header/hero — vermelho tricolor com leve profundidade */
  .gradient-hero{
    background:var(--gradient-hero);
    box-shadow:var(--shadow-header);
  }

  /* Área do chat — pattern discreto tipo WhatsApp */
  .chat-bg-area{
    background-color:var(--chat-bg);
    background-image:
      radial-gradient(circle at 25% 25%, rgba(0,0,0,.025) 1px, transparent 1px),
      radial-gradient(circle at 75% 75%, rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:22px 22px, 22px 22px;
    background-position:0 0, 11px 11px;
  }
  .dark .chat-bg-area{
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.02) 1px, transparent 1px),
      radial-gradient(circle at 75% 75%, rgba(255,255,255,.02) 1px, transparent 1px);
  }

  /* Sombras / cartões */
  .shadow-bubble{ box-shadow:var(--shadow-bubble)!important; }

  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}
  .scrollbar-thin::-webkit-scrollbar-track{background:transparent}
  .scrollbar-thin::-webkit-scrollbar-thumb{
    background:color-mix(in oklab, var(--muted-foreground) 35%, transparent);

  }

    background:color-mix(in oklab, var(--muted-foreground) 55%, transparent);
  }

  /* Animações mais suaves e naturais */
  @keyframes slideUp{
    from{transform:translateY(10px) scale(.98);opacity:0}
    to{transform:translateY(0) scale(1);opacity:1}
  }
  @keyframes slideLeft{
    from{transform:translateX(100%);opacity:.6}
    to{transform:translateX(0);opacity:1}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{
    0%{transform:scale(.9);opacity:0}
    60%{transform:scale(1.02);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  .anim-slide-up{animation:slideUp .28s cubic-bezier(0.22,1,0.36,1) forwards}
  .anim-slide-left{animation:slideLeft .32s cubic-bezier(0.22,1,0.36,1) forwards}
  .anim-fade{animation:fadeIn .2s ease forwards}

  /* ===== Classes utilitárias mapeadas para tokens (mantidas iguais) ===== */
  .bg-card { background-color: var(--card); }
  .bg-background { background-color: var(--background); }
  .bg-secondary { background-color: var(--secondary); }
  .bg-muted { background-color: var(--muted); }
  .bg-popover { background-color: var(--popover); }
  .bg-primary { background-color: var(--primary); }
  .bg-destructive { background-color: var(--destructive); }

  .text-foreground { color: var(--foreground); }
  .text-muted-foreground { color: var(--muted-foreground); }
  .text-primary { color: var(--primary); }
  .text-primary-foreground { color: var(--primary-foreground); }
  .text-popover-foreground { color: var(--popover-foreground); }
  .text-secondary-foreground { color: var(--secondary-foreground); }
  .text-destructive { color: var(--destructive); }

  .border-border { border-color: var(--border); }
  .ring-ring { --tw-ring-color: var(--ring); }

  /* Cards com sombra sutil moderna */
  .bg-card, .bg-popover{
    box-shadow: var(--shadow-card);
  }

  .rounded-xl{ border-radius:16px; }
  .rounded-2xl{ border-radius:20px; }

  /* Balões de chat com raio maior tipo iMessage/WhatsApp */
  [style*="var(--bubble-me)"], [style*="var(--bubble-other)"]{
    border-radius:var(--radius-bubble)!important;
    line-height:1.35;
    letter-spacing:.005em;
  }
  /* Preserva o "rabinho" da bolha (o JS já ajusta o canto pequeno via inline style) */
  [style*="border-top-right-radius:4px"]{ border-top-right-radius:6px!important; }
  [style*="border-top-left-radius:4px"]{ border-top-left-radius:6px!important; }

  /* Inputs / textareas — foco estilo iOS */
  input, textarea, select, button{
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    box-shadow:0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent)!important;
    border-color:var(--ring)!important;
    transition:box-shadow .15s ease, border-color .15s ease;
  }

  /* Botões — micro-interação */
  button{
    transition: transform .12s ease, background-color .18s ease, opacity .18s ease, filter .18s ease;
  }
  button:active{ transform:scale(.97); }
  button:hover:not(:disabled){ filter:brightness(1.03); }

  /* Botão primário com leve gradiente */
  .bg-primary{
    background-image:linear-gradient(180deg,
      color-mix(in oklab, var(--primary) 100%, white 6%),
      var(--primary));
  }

  header.gradient-hero{
    backdrop-filter:saturate(140%);
    -webkit-backdrop-filter:saturate(140%);
  }

  hr, .border-t, .border-b, .border{
    border-color:var(--border);
  }

  /* Seleção de texto na cor da marca */
  ::selection{
    background:color-mix(in oklab, var(--primary) 30%, transparent);

    border-radius:20px;
    box-shadow:var(--shadow-card);

  }

  .nav-item.is-active{
    background:color-mix(in oklab, var(--primary) 9%, var(--secondary));
  }
  .nav-item .nav-item-icon{
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .nav-item:hover .nav-item-icon{ transform:scale(1.08); }
  @keyframes navIconPop{
    0%{ transform:scale(.75) rotate(-6deg); opacity:.4; }
    60%{ transform:scale(1.12) rotate(2deg); }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .nav-item.is-active .nav-item-icon{
    animation:navIconPop .34s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes navGlowIn{
    from{ transform:scaleX(.8); opacity:0; }
    to{ transform:scaleX(1); opacity:1; }
  }
  .nav-item.is-active::before{
    content:"";
    position:absolute; inset:0;
    border-radius:14px;
    background:linear-gradient(90deg, color-mix(in oklab, var(--primary) 16%, transparent), transparent 70%);
    transform-origin:left center;
    animation:navGlowIn .3s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  @keyframes navBarGrow{
    from{ transform:scaleY(0); opacity:0; }
    to{ transform:scaleY(1); opacity:1; }
  }
  .nav-item-indicator{
    position:absolute; left:2px; top:8px; bottom:8px;
    width:3px; border-radius:9999px;
    background:var(--gradient-hero);
    transform-origin:center;
  }
  .nav-item.is-active .nav-item-indicator{
    animation:navBarGrow .3s cubic-bezier(.22,1,.36,1);
  }
  .nav-badge{
    display:inline-block; width:8px; height:8px; border-radius:9999px;
    background:#ef4444; box-shadow:0 0 0 2px var(--card);
    animation:pulseDot 2s ease-out infinite;
    flex-shrink:0;
  }


  /* Quando o teclado do chat está aberto, esconde o hero grande */
  body.chat-keyboard-open #app-hero {
    display: none !important;
  }

  /* Respeita quem prefere menos movimento */
  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; }
  }
</style>

  // Decodifica o base64 preservando corretamente acentos/emojis (UTF-8) e guarda o HTML
  // completo do chat como texto puro. Esse texto é atribuído diretamente à propriedade
  // .srcdoc do iframe via JavaScript (não como atributo HTML) em render(), o que faz o
  // iframe herdar a MESMA origem da página principal — por isso localStorage e a
  // persistência do Firebase Auth funcionam normalmente lá dentro. (Com "data:" URI ou
  // Blob URL, alguns navegadores tratam o iframe como origem "opaca"/bloqueada, o que
  // quebrava o React silenciosamente e deixava a tela em branco.)
  function decodeBase64Utf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function updateQuizStreak(scoreDaRodada){
    const todayStr = new Date().toISOString().slice(0,10);
    const s = { ...state.quizStreak };
    if(s.lastPlayedDate !== todayStr){
      const ontemStr = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      s.streak = (s.lastPlayedDate === ontemStr) ? (s.streak||0)+1 : 1;
      s.lastPlayedDate = todayStr;
    }
    s.melhorSequencia = Math.max(s.melhorSequencia||0, s.streak);
    s.totalAcertos = (s.totalAcertos||0) + scoreDaRodada;
    localStorage.setItem("spfc_quiz_streak", JSON.stringify(s));
    state.quizStreak = s;
    if(state.nick.trim()){
      setDoc(doc(db, "quiz_ranking", state.uid), { nick: state.nick, totalAcertos: s.totalAcertos, melhorSequencia: s.melhorSequencia }, { merge:true }).catch(()=>{});
    }
  }

  function applyTheme(){
    const t = THEMES[state.themeIdx];
    Object.entries(t.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k,v));
  }
  function applyDark(){ document.documentElement.classList.toggle("dark", state.dark); }

  function setState(patch){ Object.assign(state, patch); render(); }

  // BUSCA A TABELA DO BRASILEIRÃO AO VIVO (dados públicos da ESPN, sem chave/cadastro).
  // Tenta dois domínios da ESPN (às vezes um responde e o outro não) e ignora o que falhar.
  async function fetchBrasileirao(){
    state.brasileirao = {...state.brasileirao, loading:true, error:null};
    render();
    const urls = [
      "https://site.api.espn.com/apis/v2/sports/soccer/bra.1/standings",
      "https://site.web.api.espn.com/apis/v2/sports/soccer/bra.1/standings"
    ];
    for(const url of urls){
      try{
        const res = await fetch(url);
        if(!res.ok) continue;
        const json = await res.json();
        const group = (json.children && json.children[0]) || json;
        const entries = (group && group.standings && group.standings.entries) || (json.standings && json.standings.entries) || [];
        if(entries.length){
          const parsed = entries.map(e=>{
            const statByName = {};
            (e.stats||[]).forEach(s=>{ statByName[s.name]=s; });
            return {
              team: (e.team && (e.team.displayName||e.team.name)) || "?",
              crest: (e.team && e.team.logos && e.team.logos[0] && e.team.logos[0].href) || "",
              rank: statByName.rank ? statByName.rank.value : null,
              pj: statByName.gamesPlayed ? statByName.gamesPlayed.displayValue : "-",
              v: statByName.wins ? statByName.wins.displayValue : "-",
              e: statByName.ties ? statByName.ties.displayValue : "-",
              d: statByName.losses ? statByName.losses.displayValue : "-",
              sg: statByName.pointDifferential ? statByName.pointDifferential.displayValue : "-",
              pts: statByName.points ? statByName.points.displayValue : "-",
            };
          });
          parsed.sort((a,b)=>(a.rank??999)-(b.rank??999));
          state.brasileirao = { loading:false, error:null, entries:parsed, updatedAt:Date.now() };
          render();
          return;
        }
      }catch(err){ /* tenta a próxima URL */ }
    }
    state.brasileirao = { loading:false, error:"Não foi possível carregar a tabela agora. Toque em Atualizar para tentar de novo.", entries: state.brasileirao.entries||null, updatedAt: state.brasileirao.updatedAt||null };
    render();
  }

  // ESCUTANDO MENSAGENS EM TEMPO REAL DO FIRESTORE
  const qMessages = query(collection(db, "mensagens"), orderBy("ts", "asc"), limitToLast(50));
  onSnapshot(qMessages, (snapshot) => {
    const msgs = [];
    snapshot.forEach((doc) => {
      msgs.push({ id: doc.id, ...doc.data() });
    });
    state.messages = msgs;
    render();
  });

  // ESCUTANDO OS PLACARES DOS JOGOS EM TEMPO REAL (aparece pra todo mundo assim que você salva)
  onSnapshot(collection(db, "placares"), (snapshot) => {
    const placares = {};
    snapshot.forEach((doc) => { placares[doc.id] = doc.data(); });
    state.placares = placares;
    render();
  });

  // ESCUTANDO O LOGIN: pode ser o administrador (e-mail/senha) OU um visitante anônimo.
  // isAdmin() é quem decide se é o administrador de verdade — visitante anônimo NUNCA é admin.
  onAuthStateChanged(auth, (user) => {
    if(!user){
      // Ninguém logado (nem admin, nem anônimo ainda, ou acabou de deslogar) -> loga anônimo
      signInAnonymously(auth).catch(()=>{});
      return;
    }
    state.user = user;
    state.uid = user.uid; // uid real e verificável do Firebase Auth (substitui o spfc_uid do localStorage)
    render();
  });

  // ESCUTANDO OS BOLÕES ABERTOS PELO ADMINISTRADOR (um por jogo)
  onSnapshot(collection(db, "boloes"), (snapshot) => {

  // ESCUTANDO AS ENQUETES CRIADAS PELO ADMINISTRADOR

  onSnapshot(collection(db, "quiz_ranking"), (snapshot) => {
    const ranking = [];
    snapshot.forEach((doc) => { ranking.push({ uid: doc.id, ...doc.data() }); });
    ranking.sort((a,b) => (b.totalAcertos||0) - (a.totalAcertos||0));

  /* ===================== RENDER ===================== */
  // Recebe avisos do chat (dentro do iframe) sobre o teclado abrir/fechar,
  // e esconde o cabeçalho grande + a barra de anúncio pra dar mais espaço ao chat.
  window.addEventListener("message", (ev) => {
    if (!ev.data || ev.data.type !== "spfc-chat-keyboard") return;
    document.body.classList.toggle("chat-keyboard-open", !!ev.data.open);
    // O toggle acima pode mudar a altura do #app-hero (ele some quando o
    // teclado abre), o que muda o tamanho/posição do slot do chat. Reposiciona
    // o iframe depois que o layout se ajustar.
    requestAnimationFrame(positionChatFrame);
  });

  // ===== "Casa" permanente do iframe do chat, FORA do #app =====
  // O <iframe id="msnChatFrame"> é criado UMA ÚNICA VEZ e nunca é
  // reanexado (appendChild) a um novo elemento pai depois disso — mover um
  // <iframe> de lugar no DOM faz o navegador recarregar o documento dele do
  // zero, o que reiniciava o chat (e disparava de novo o som/aviso "entrando
  // online") toda vez que o usuário saía da aba Chat e voltava, ou entrava em
  // qualquer outra aba do app.
  // Em vez de mover o iframe pra dentro do slot reservado a cada render(),
  // ele fica sempre fixo fora do #app e é apenas "desenhado por cima" da
  // posição exata do slot (via position:fixed + coordenadas calculadas),
  // ficando escondido (display:none) quando a aba do chat não está ativa.
  let chatFrameHost = null;
  function ensureChatFrameHost(){
    if (!chatFrameHost) {
      chatFrameHost = document.createElement("div");
      chatFrameHost.id = "msnChatFrameHost";
      chatFrameHost.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:25;display:none;pointer-events:none;";
      document.body.appendChild(chatFrameHost);
      const frame = document.createElement("iframe");
      frame.id = "msnChatFrame";
      frame.title = "Chat";
      frame.className = "w-full h-full border-0 block";
      frame.setAttribute("allow", "clipboard-write");
      chatFrameHost.appendChild(frame);
    }
    return chatFrameHost;
  }

  // Recalcula e aplica a posição/tamanho do host do iframe por cima do
  // #msnChatSlot (só quando a aba do chat está ativa); do contrário, esconde.
  function positionChatFrame(){
    const host = chatFrameHost;
    if (!host) return;
    const slot = document.getElementById("msnChatSlot");
    if (state.entered && state.page === "chat" && slot) {
      const r = slot.getBoundingClientRect();
      host.style.left = r.left + "px";
      host.style.top = r.top + "px";
      host.style.width = r.width + "px";
      host.style.height = r.height + "px";
      host.style.display = "block";
      host.style.pointerEvents = "auto";
    } else {
      host.style.display = "none";
      host.style.pointerEvents = "none";
    }
  }
  window.addEventListener("resize", () => positionChatFrame());
  window.addEventListener("orientationchange", () => requestAnimationFrame(positionChatFrame));
  // Corrige o caso em que o layout (altura real da tela no mobile, imagens,
  // fontes) só "assenta" um instante depois do primeiro render: sem isso, o
  // iframe do chat podia ficar com posição/tamanho desatualizados até o
  // usuário mexer em algo (abrir/fechar o menu) que forçasse um novo cálculo.
  window.addEventListener("load", () => requestAnimationFrame(positionChatFrame));
  if (typeof ResizeObserver !== "undefined") {
    const chatPositionObserver = new ResizeObserver(() => positionChatFrame());
    chatPositionObserver.observe(document.body);
  }

  function render(){
    applyDark(); applyTheme();

    const host = ensureChatFrameHost();

    $("#app").innerHTML = state.entered ? appView() : loginView();
    bind();

    // Se a página atual é o chat, garante que o iframe (sempre o mesmo,
    // nunca recriado nem reanexado) já foi carregado e reposiciona o host
    // por cima do slot reservado.
    if (state.entered && state.page==="chat") {
      const sc = $("#scrollArea"); if(sc) sc.scrollTop = sc.scrollHeight;
      const frame = host.querySelector("#msnChatFrame");
      if (frame && !frame.dataset.loaded) {
        frame.srcdoc = MSN_CHAT_HTML;
        frame.dataset.loaded = "1";
        // Detecção direta (mais confiável que postMessage): como o iframe usa
        // srcdoc, ele herda a mesma origem da página principal, então dá pra
        // "escutar" o foco dos campos de texto de dentro dele diretamente.
        // Isso garante que o modo "teclado aberto" seja ativado mesmo que o
        // aviso via postMessage não chegue por algum motivo.
        frame.addEventListener("load", () => {
          try {
            const doc = frame.contentDocument;
            if (!doc) return;
            const isField = (el) => !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
            doc.addEventListener("focusin", (e) => {
              if (isField(e.target)) { document.body.classList.add("chat-keyboard-open"); requestAnimationFrame(positionChatFrame); }
            });
            doc.addEventListener("focusout", () => {
              setTimeout(() => {
                if (!isField(doc.activeElement)) { document.body.classList.remove("chat-keyboard-open"); requestAnimationFrame(positionChatFrame); }
              }, 100);
            });
          } catch (err) { /* se por algum motivo não der acesso direto, o postMessage cobre */ }

  function chatView(){

    return `
    <div id="msnChatSlot" class="flex-1 overflow-hidden bg-card"></div>`;

  function messageBubble(m){
    // Identifica o dono da mensagem pelo uid do Firebase Auth (login anônimo).
    // Fallback por nick+avatar só pra mensagens antigas, enviadas antes dessa mudança,
    // que ainda não tinham o campo "uid" salvo no Firestore.
    const mine = m.uid ? (m.uid === state.uid) : (m.nick === state.nick && m.avatar === state.avatar);
    const parent = m.replyTo ? state.messages.find(x=>x.id===m.replyTo) : null;
    
    // CORREÇÃO: Garante o fallback de m.reactions para evitar que m.reactions seja undefined
    const reactionEntries = Object.entries(m.reactions || {}).filter(([k, n]) => typeof n === 'number' && n > 0);
    const totalReactions = reactionEntries.reduce((acc, [, n]) => acc + n, 0);
    
    return `<div class="flex gap-2 ${mine?'justify-end':'justify-start'} mb-3">
      ${!mine?`<img src="${m.avatar}" class="h-8 w-8 rounded-full self-end mb-1 object-cover"/>`:""}
      <div class="relative max-w-[78%] flex flex-col ${mine?'items-end':'items-start'}">
        <div data-act="toggleMenu" data-id="${m.id}" class="relative rounded-2xl px-3 py-2 text-xs cursor-pointer select-none shadow-bubble"
             style="background:${mine?'var(--bubble-me)':'var(--bubble-other)'};color:${mine?'var(--bubble-me-fg)':'var(--bubble-other-fg)'};border-top-${mine?'right':'left'}-radius:4px">
          ${parent?`<div class="mb-1 rounded-lg px-2 py-1 text-[11px] border-l-2" style="border-color:${mine?'rgba(255,255,255,.7)':'var(--primary)'};background:${mine?'rgba(255,255,255,.15)':'var(--secondary)'};color:${mine?'rgba(255,255,255,.95)':'var(--bubble-other-fg)'}"><div class="font-semibold">${esc(parent.nick)}</div><div class="opacity-80 truncate">${esc(parent.text)}</div></div>`:""}
          ${!mine?`<div class="text-[10px] font-bold mb-0.5 text-primary">${esc(m.nick)}</div>`:""}
          <div class="whitespace-pre-wrap break-words leading-relaxed">${esc(m.text)}</div>
          <div class="text-[9px] mt-1 text-right ${mine?'opacity-75':'opacity-50'}">${m.edited?'<span class="mr-1 italic">editada</span>':''}${fmtTime(m.ts)}</div>

          ${state.openMenu===m.id?`
            <div data-stop class="absolute z-20 top-full mt-1 ${mine?'right-0':'left-0'} bg-popover text-popover-foreground rounded-xl shadow-xl border border-border py-1 text-[11px] min-w-[130px]">
              <button data-act="reply" data-id="${m.id}" class="w-full px-3 py-1.5 text-left hover:bg-secondary flex items-center gap-2 text-foreground">↩️ Responder</button>

  function palpiteId(jid, uid){ return `${jid}__${uid}`; }
  function enqueteVotoId(eid, uid){ return `${eid}__${uid}`; }

  function calcRankingBolao(){
    const porUid = {};
    Object.values(state.palpites).forEach(p=>{
      const placar = state.placares[p.jogoId];
      if(!placar) return;
      let pontos = 0;
      if(+p.home === +placar.home && +p.away === +placar.away) pontos = 3;
      else {
        const rp = Math.sign(p.home - p.away);
        const rr = Math.sign(placar.home - placar.away);
        if(rp === rr) pontos = 1;
      }
      if(!porUid[p.uid]) porUid[p.uid] = { nick: p.nick, pontos: 0 };
      porUid[p.uid].pontos += pontos;
      porUid[p.uid].nick = p.nick;
    });
    return Object.entries(porUid).map(([uid,v])=>({uid,...v})).sort((a,b)=>b.pontos-a.pontos).slice(0,10);
  }

  function bolaoPage(){
    const titleHtml = `${ic("target","w-5 h-5 inline -mt-1")} Bolão & Enquete`;
    const ranking = calcRankingBolao();
    const jogosAbertos = JOGOS.filter(j=>{
      const id = jogoId(j);
      return state.boloes[id]?.aberto && !state.placares[id];
    });
    const enqueteAtiva = state.enquetes.find(e=>e.ativa);

    const rankingHtml = `
      <div class="rounded-2xl border border-border bg-card p-4">
        <p class="font-bold text-foreground mb-2 flex items-center gap-2">${ic("trophy","w-4 h-4")} Ranking do Bolão</p>
        ${ranking.length?`
        <div class="space-y-1.5">
          ${ranking.map((r,i)=>`
            <div class="flex items-center justify-between text-sm ${r.uid===state.uid?'font-bold':''} text-foreground">
              <span class="truncate">${i+1}. ${esc(r.nick||"Torcedor")}</span>
              <span class="shrink-0">${r.pontos} pts</span>
            </div>`).join("")}
        </div>`:`<p class="text-sm text-muted-foreground">Ninguém pontuou ainda. Palpite nos jogos abaixo!</p>`}
      </div>`;

    const palpitesHtml = jogosAbertos.length ? jogosAbertos.map(j=>{
      const id = jogoId(j);
      const meuId = palpiteId(id, state.uid);
      const meuPalpite = state.palpites[meuId];
      const isEditing = state.palpiteEditingId === id;
      return `
      <div class="rounded-xl border border-border bg-card p-4">
        <p class="text-xs text-muted-foreground mb-2 text-center">${esc(j.data)} · ${esc(j.hora)}</p>
        <div class="flex items-center gap-2 justify-center text-sm font-semibold text-foreground mb-3">
          <span class="flex items-center gap-1.5">${crestOrInitial(j.home)}<span>${esc(j.home)}</span></span>
          <span class="opacity-50">x</span>
          <span class="flex items-center gap-1.5"><span>${esc(j.away)}</span>${crestOrInitial(j.away)}</span>
        </div>
        ${isEditing?`
          <div class="flex items-center justify-center gap-2 flex-wrap">
            <input id="palpiteHomeInput" type="number" min="0" value="${esc(state.palpiteTempHome)}" class="w-14 rounded-lg border border-border bg-background px-2 py-1.5 text-center outline-none focus:ring-2 ring-ring text-foreground"/>
            <span class="text-xs opacity-60 text-foreground">x</span>
            <input id="palpiteAwayInput" type="number" min="0" value="${esc(state.palpiteTempAway)}" class="w-14 rounded-lg border border-border bg-background px-2 py-1.5 text-center outline-none focus:ring-2 ring-ring text-foreground"/>
            <button data-act="salvarPalpite" data-id="${id}" class="rounded-lg px-3 py-1.5 text-xs font-semibold text-primary-foreground gradient-hero">Salvar</button>
            <button data-act="cancelarPalpite" class="rounded-lg px-3 py-1.5 text-xs font-semibold border border-border text-foreground hover:bg-secondary">Cancelar</button>
          </div>`:
          meuPalpite?`
          <div class="flex items-center justify-center gap-3">
            <p class="text-sm text-foreground">Seu palpite: <span class="font-bold">${meuPalpite.home} x ${meuPalpite.away}</span></p>
            <button data-act="editarPalpite" data-id="${id}" class="text-xs font-semibold rounded-lg px-2.5 py-1 border border-border text-foreground hover:bg-secondary">Editar</button>
          </div>`:
          `<button data-act="editarPalpite" data-id="${id}" class="w-full rounded-lg py-2 text-sm font-semibold border border-border text-foreground hover:bg-secondary">Dar palpite</button>`}
        ${isAdmin(state.user)?`<div class="mt-3 pt-3 border-t border-border flex justify-center"><button data-act="fecharBolao" data-id="${id}" class="text-xs text-muted-foreground hover:text-foreground underline">Encerrar bolão deste jogo</button></div>`:""}
      </div>`;
    }).join("") : `<p class="text-sm text-muted-foreground text-center py-4">Nenhum bolão aberto no momento.</p>`;

    const adminBolaoHtml = isAdmin(state.user) ? `
      <div class="rounded-2xl border border-dashed border-border p-4">
        <p class="font-bold text-foreground mb-2 text-sm">Administrador — abrir bolão para um jogo</p>
        <div class="space-y-2">
          ${JOGOS.filter(j=>!state.placares[jogoId(j)]).map(j=>{
            const id = jogoId(j);
            const aberto = state.boloes[id]?.aberto;
            return `<div class="flex items-center justify-between gap-2 text-xs">
              <span class="text-foreground truncate">${esc(j.home)} x ${esc(j.away)} — ${esc(j.data)}</span>
              ${aberto?`<span class="shrink-0 text-green-600 font-semibold">Aberto ✓</span>`:
                `<button data-act="abrirBolao" data-id="${id}" class="shrink-0 rounded-lg px-2.5 py-1 border border-border text-foreground hover:bg-secondary">Abrir bolão</button>`}
            </div>`;
          }).join("")}
        </div>
      </div>` : "";

    const votosDaAtiva = enqueteAtiva ? Object.values(state.enqueteVotos).filter(v=>v.enqueteId===enqueteAtiva.id) : [];
    const totalVotos = votosDaAtiva.length;
    const meuVotoAtiva = enqueteAtiva ? state.enqueteVotos[enqueteVotoId(enqueteAtiva.id, state.uid)] : null;

    const enqueteHtml = `
      <div class="rounded-2xl border border-border bg-card p-4">
        <p class="font-bold text-foreground mb-3 flex items-center gap-2">${ic("help","w-4 h-4")} Enquete</p>
        ${enqueteAtiva?`
          <p class="text-sm font-semibold text-foreground mb-3">${esc(enqueteAtiva.pergunta)}</p>
          <div class="space-y-2">
            ${enqueteAtiva.opcoes.map((op,i)=>{
              const votosOpcao = votosDaAtiva.filter(v=>v.opcao===i).length;
              const pct = totalVotos ? Math.round(votosOpcao/totalVotos*100) : 0;
              const escolhida = meuVotoAtiva && meuVotoAtiva.opcao===i;
              return `<button data-act="votarEnquete" data-id="${enqueteAtiva.id}" data-i="${i}" class="w-full text-left rounded-lg border ${escolhida?'border-primary':'border-border'} p-2.5 relative overflow-hidden hover:bg-secondary transition">
                <div class="absolute inset-y-0 left-0 bg-secondary/70" style="width:${pct}%"></div>
                <div class="relative flex items-center justify-between text-sm text-foreground">
                  <span class="truncate pr-2">${escolhida?'✓ ':''}${esc(op)}</span>
                  <span class="shrink-0 font-semibold">${pct}%</span>
                </div>
              </button>`;
            }).join("")}
          </div>
          <p class="text-xs text-muted-foreground mt-2">${totalVotos} voto${totalVotos===1?"":"s"}</p>
        `:`<p class="text-sm text-muted-foreground">Nenhuma enquete no momento.</p>`}
      </div>`;

    const adminEnqueteHtml = isAdmin(state.user) ? `
      <div class="rounded-2xl border border-dashed border-border p-4 space-y-3">
        <p class="font-bold text-foreground text-sm">Administrador — criar enquete</p>
        <input id="enquetePerguntaInput" value="${esc(state.novaEnquetePergunta)}" placeholder="Pergunta da enquete" class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 ring-ring text-foreground"/>
        ${state.novaEnqueteOpcoes.map((op,i)=>`
          <input data-opcao-idx="${i}" class="enqueteOpcaoInput w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 ring-ring text-foreground" placeholder="Opção ${i+1}" value="${esc(op)}"/>
        `).join("")}
        <div class="flex items-center gap-2 flex-wrap">
          ${state.novaEnqueteOpcoes.length<4?`<button data-act="addOpcaoEnquete" class="text-xs font-semibold rounded-lg px-3 py-1.5 border border-border text-foreground hover:bg-secondary">+ opção</button>`:""}
          <button data-act="criarEnquete" class="ml-auto rounded-lg px-4 py-2 text-sm font-semibold text-primary-foreground gradient-hero">Publicar enquete</button>
        </div>
        ${state.enquetes.length?`
        <div class="pt-2 border-t border-border space-y-1.5">
          ${state.enquetes.map(en=>`
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="text-foreground truncate">${esc(en.pergunta)} ${en.ativa?'<span class="text-green-600 font-semibold">(ativa)</span>':'<span class="opacity-50">(encerrada)</span>'}</span>
              ${en.ativa?`<button data-act="encerrarEnquete" data-id="${en.id}" class="shrink-0 rounded-lg px-2.5 py-1 border border-border text-foreground hover:bg-secondary">Encerrar</button>`:""}
            </div>`).join("")}
        </div>`:""}
      </div>` : "";

    return section(titleHtml, `
      ${rankingHtml}
      <p class="font-bold text-foreground text-sm mt-1">Palpites em aberto</p>
      <div class="space-y-3">${palpitesHtml}</div>
      ${adminBolaoHtml}
      ${enqueteHtml}
      ${adminEnqueteHtml}
    `);
  }

  function quizPage(){
    const q=state.quiz;
    const titleHtml = `${ic("help","w-5 h-5 inline -mt-1")} Quiz SPFC`;
    const streakHtml = `<div class="flex items-center justify-between text-xs rounded-lg bg-secondary/60 px-3 py-2 text-foreground">
      <span>🔥 ${state.quizStreak.streak||0} dia${(state.quizStreak.streak||0)===1?"":"s"} seguido${(state.quizStreak.streak||0)===1?"":"s"} jogando</span>
      <span>Total de acertos: ${state.quizStreak.totalAcertos||0}</span>
    </div>`;
    if(q.done){
      const ranking = state.quizRanking;
      return section(titleHtml,`
        ${streakHtml}
        <div class="rounded-2xl p-6 text-center text-white shadow-lg gradient-hero">
          <span class="inline-flex mb-2">${ic("trophy","w-12 h-12")}</span>
          <p class="text-2xl font-bold">Você acertou ${q.score} de ${QUIZ.length}</p>
          <p class="opacity-90 mt-1 text-sm">${q.score>=12?"Tricolor de coração! ❤️🤍🖤":q.score>=7?"Mandou bem! 👏":"Estude mais a história do clube! 📚"}</p>
        </div>
        <button data-act="quizReset" class="mt-4 w-full rounded-xl py-3 font-semibold text-primary-foreground gradient-hero">Jogar novamente</button>
        <div class="rounded-2xl border border-border bg-card p-4">
          <p class="font-bold text-foreground mb-2 flex items-center gap-2">${ic("trophy","w-4 h-4")} Ranking — quem mais sabe do SPFC</p>
          ${ranking.length?`
          <div class="space-y-1.5">
            ${ranking.map((r,i)=>`
              <div class="flex items-center justify-between text-sm ${r.uid===state.uid?'font-bold':''} text-foreground">
                <span class="truncate">${i+1}. ${esc(r.nick||"Torcedor")}</span>
                <span class="shrink-0">${r.totalAcertos||0} acertos</span>
              </div>`).join("")}
          </div>`:`<p class="text-sm text-muted-foreground">Jogue pra aparecer no ranking!</p>`}
        </div>`);
    }
    const cur = QUIZ[q.idx];
    const answered = q.sel!==null;
    const isLast = q.idx+1>=QUIZ.length;
    return section(titleHtml,`
      ${streakHtml}
      <div class="flex items-center justify-between text-xs text-muted-foreground"><span>Pergunta ${q.idx+1}/${QUIZ.length}</span><span>Pontos: ${q.score}</span></div>
      <div class="h-2 rounded-full bg-secondary overflow-hidden"><div class="h-full gradient-hero" style="width:${(q.idx/QUIZ.length)*100}%"></div></div>
      <div class="rounded-2xl border border-border bg-card p-5">
        <p class="font-semibold mb-3 text-foreground">${esc(cur.q)}</p>
        <div class="grid gap-2">
          ${cur.o.map((opt,i)=>{
            const correct = q.sel!==null && i===cur.a;
            const wrong = q.sel===i && i!==cur.a;
            const cls = correct?'bg-green-500/20 border-green-500':wrong?'bg-red-500/20 border-red-500':'border-border hover:bg-secondary';
            return `<button data-act="quizAns" data-i="${i}" ${q.sel!==null?'disabled':''} class="text-left rounded-xl px-4 py-3 border transition ${cls} text-foreground">${esc(opt)}</button>`;
          }).join("")}
        </div>
      </div>
      <button data-act="quizNext" ${answered?'':'disabled'} class="w-full flex items-center justify-center gap-2 rounded-xl py-3 font-semibold text-primary-foreground gradient-hero transition disabled:opacity-40 disabled:cursor-not-allowed">
        ${isLast?'Ver resultado':'Próxima'} ${ic("arrowRight","w-4 h-4")}
      </button>`);
  }

  /* ===================== EVENTS ===================== */
  function bind(){
    const root = $("#app");
    if(!root) return;
    root.onclick = handleClick;
    
    const nick = $("#nickInput");
    if(nick) {
      nick.oninput = e => { 
        state.nick = e.target.value; 
        const b=$("#enterBtn"); 
        if(b){ if(state.nick.trim()) b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } 
      };
    }
    
    const enter = $("#enterBtn"); 
    if(enter) {
      enter.onclick = () => { 
        if(state.nick.trim()) {
          const bloqueada = findBlockedWord(state.nick);
          if(bloqueada){
            alert("🚫 Esse apelido não é permitido neste chat. Escolha outro nome.");
            return;
          }
          setState({entered:true});
        }
      };
    }
    
    const mi = $("#msgInput");
    if(mi){
      mi.oninput = e => { state.input = e.target.value; };
      mi.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
      mi.focus(); mi.selectionStart = mi.value.length;
    }

    const ph = $("#placarHomeInput");
    if(ph) ph.oninput = e => { state.tempHome = e.target.value; };
    const pa = $("#placarAwayInput");
    if(pa) pa.oninput = e => { state.tempAway = e.target.value; };
    const gh = $("#golsHomeInput");
    if(gh) gh.oninput = e => { state.tempGolsHome = e.target.value; };
    const ga = $("#golsAwayInput");
    if(ga) ga.oninput = e => { state.tempGolsAway = e.target.value; };

    const ae = $("#adminEmailInput");
    if(ae) ae.oninput = e => { state.adminEmail = e.target.value; };
    const as = $("#adminSenhaInput");
    if(as){
      as.oninput = e => { state.adminSenha = e.target.value; };
      as.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); doAdminLogin(); } };
    }

    const pph = $("#palpiteHomeInput");
    if(pph) pph.oninput = e => { state.palpiteTempHome = e.target.value; };
    const ppa = $("#palpiteAwayInput");
    if(ppa) ppa.oninput = e => { state.palpiteTempAway = e.target.value; };

    const epi = $("#enquetePerguntaInput");
    if(epi) epi.oninput = e => { state.novaEnquetePergunta = e.target.value; };
    document.querySelectorAll(".enqueteOpcaoInput").forEach(inp=>{
      inp.oninput = e => {
        const idx = +inp.dataset.opcaoIdx;
        const copia = [...state.novaEnqueteOpcoes];
        copia[idx] = e.target.value;
        state.novaEnqueteOpcoes = copia;
      };
    });
  }

  async function handleClick(e){
    const stop = e.target.closest("[data-stop]");
    const t = e.target.closest("[data-act]");
    if(!t) return;
    if(stop && !t.contains(stop) && !stop.contains(t)) return;
    const a = t.dataset.act;
    switch(a){
      case "toggleDark": state.dark=!state.dark; render(); break;
      case "pickAvatar": state.avatar = avatarUrl(t.dataset.seed); render(); break;
      case "openMenu": setState({menuOpen:true}); break;
      case "closeMenu": if(t.tagName==="BUTTON"||!e.target.closest("[data-stop]")) setState({menuOpen:false}); break;
      case "setPage": {
        document.body.classList.remove("chat-keyboard-open");
        setState({page:t.dataset.key, menuOpen:false, openMenu:null, openReactions:null});
        if(t.dataset.key==="tabela" && (!state.brasileirao.entries || Date.now()-(state.brasileirao.updatedAt||0) > 120000)) fetchBrasileirao();
        break;
      }
      case "refreshTabela": fetchBrasileirao(); break;
      case "openAvatarPicker": setState({showAvatarPicker:true, menuOpen:false}); break;
      case "closeAvatarPicker": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showAvatarPicker:false}); break;
      case "setAvatar": state.avatar = avatarUrl(t.dataset.seed); setState({showAvatarPicker:false}); break;
      case "openThemes": setState({showThemes:true, menuOpen:false}); break;
      case "closeThemes": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showThemes:false}); break;
      case "pickTheme": state.themeIdx=+t.dataset.i; setState({showThemes:false}); break;
      case "share": shareApp(); break;
      case "openShare": setState({showShare:true, menuOpen:false}); break;
      case "closeShare": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showShare:false}); break;
      case "shareCopy": {
        try{
          await navigator.clipboard.writeText(location.href);
          state.shareMsg="Link copiado!"; render();
          setTimeout(()=>{state.shareMsg=""; render();},2000);
        }catch{}
        break;
      }
      case "shareNative": {
        try{ await navigator.share({title:"Chat Tú és Forte, Tú és Grande",text:"Entre no Chat Tú és Forte, Tú és Grande e vem torcer com a gente!",url:location.href}); }catch{}
        break;
      }
      case "logout": document.body.classList.remove("chat-keyboard-open"); Object.assign(state,{entered:false,messages:[],input:"",editingId:null,replyId:null,page:"chat",menuOpen:false,showAvatarPicker:false,showThemes:false,showShare:false}); render(); break;
      case "send": send(); break;
      case "cancelReplyEdit": state.replyId=null; if(state.editingId){state.editingId=null; state.input="";} render(); break;
      case "toggleMenu": e.stopPropagation(); setState({openMenu: state.openMenu===t.dataset.id?null:t.dataset.id, openReactions:null}); break;
      case "reply": setState({replyId:t.dataset.id, openMenu:null}); break;
      case "openReact": setState({openReactions:t.dataset.id, openMenu:null}); break;
      case "edit": { const m=state.messages.find(x=>x.id===t.dataset.id); if(m){state.editingId=m.id; state.input=m.text; state.replyId=null; state.openMenu=null; render();} break; }
      case "del": 
        await deleteDoc(doc(db, "mensagens", t.dataset.id));
        if(state.editingId===t.dataset.id){state.editingId=null;state.input="";} 
        state.openMenu=null; 
        break;
      case "react": { 
        const id=t.dataset.id, k=t.dataset.k; 
        const m=state.messages.find(x=>x.id===id);
        if(m){
          const currentReactions = m.reactions || {};
          await updateDoc(doc(db, "mensagens", id), {
            [`reactions.${k}`]: (currentReactions[k] || 0) + 1
          });
        }
        state.openReactions=null; 
        break; 
      }
      case "closeOverlays": if(state.openMenu||state.openReactions) setState({openMenu:null,openReactions:null}); break;
      case "quizAns": { if(state.quiz.sel!==null) return; const i=+t.dataset.i; const cur=QUIZ[state.quiz.idx]; state.quiz.sel=i; if(i===cur.a) state.quiz.score++; render(); break; }
      case "quizNext": {
        if(state.quiz.sel===null) return;
        if(state.quiz.idx+1>=QUIZ.length){
          state.quiz.done=true;
          updateQuizStreak(state.quiz.score);
        }
        else { state.quiz.idx++; state.quiz.sel=null; }
        render();
        break;
      }
      case "quizReset": state.quiz={idx:0,score:0,sel:null,done:false}; render(); break;
      case "editPlacar": {
        if(!isAdmin(state.user)){
          alert('Você precisa fazer login como administrador primeiro. Vá até a aba "Administrador" no menu.');
          return;
        }
        const id = t.dataset.id;
        const atual = state.placares[id];
        setState({ editingJogoId:id, tempHome: atual?String(atual.home):"", tempAway: atual?String(atual.away):"", tempGolsHome: atual?.golsHome||"", tempGolsAway: atual?.golsAway||"" });
        break;
      }
      case "cancelPlacar": setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" }); break;
      case "savePlacar": {
        const id = t.dataset.id;
        const h = state.tempHome.trim(), av = state.tempAway.trim();
        if(h==="" || av==="" || isNaN(+h) || isNaN(+av) || +h<0 || +av<0){
          alert("Preencha os dois placares com números válidos.");
          return;
        }
        await setDoc(doc(db, "placares", id), { home:+h, away:+av, golsHome: state.tempGolsHome.trim(), golsAway: state.tempGolsAway.trim() });
        setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" });
        break;
      }
      case "clearPlacar": {
        const id = t.dataset.id;
        await deleteDoc(doc(db, "placares", id));
        setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" });
        break;
      }
      case "adminLogin": await doAdminLogin(); break;
      case "adminLogout": await signOut(auth); break;

      case "editarPalpite": {
        const id = t.dataset.id;
        const atual = state.palpites[palpiteId(id, state.uid)];
        setState({ palpiteEditingId:id, palpiteTempHome: atual?String(atual.home):"", palpiteTempAway: atual?String(atual.away):"" });
        break;
      }
      case "cancelarPalpite": setState({ palpiteEditingId:null, palpiteTempHome:"", palpiteTempAway:"" }); break;
      case "salvarPalpite": {
        const id = t.dataset.id;
        const h = state.palpiteTempHome.trim(), av = state.palpiteTempAway.trim();
        if(h==="" || av==="" || isNaN(+h) || isNaN(+av) || +h<0 || +av<0){
          alert("Preencha os dois placares do seu palpite com números válidos.");
          return;
        }
        if(!state.nick.trim()){ alert("Escolha um nome antes de palpitar."); return; }
        await setDoc(doc(db, "palpites", palpiteId(id, state.uid)), { uid: state.uid, nick: state.nick, jogoId: id, home:+h, away:+av, ts: Date.now() });
        setState({ palpiteEditingId:null, palpiteTempHome:"", palpiteTempAway:"" });
        break;
      }
      case "abrirBolao": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await setDoc(doc(db, "boloes", id), { aberto:true });
        render();
        break;
      }
      case "fecharBolao": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await setDoc(doc(db, "boloes", id), { aberto:false });
        render();
        break;
      }
      case "addOpcaoEnquete": {
        if(state.novaEnqueteOpcoes.length>=4) return;
        setState({ novaEnqueteOpcoes:[...state.novaEnqueteOpcoes, ""] });
        break;
      }
      case "criarEnquete": {
        if(!isAdmin(state.user)) return;
        const pergunta = state.novaEnquetePergunta.trim();
        const opcoes = state.novaEnqueteOpcoes.map(o=>o.trim()).filter(Boolean);
        if(!pergunta || opcoes.length<2){ alert("Preencha a pergunta e ao menos 2 opções."); return; }
        await addDoc(collection(db, "enquetes"), { pergunta, opcoes, ativa:true, criadaEm: Date.now() });
        setState({ novaEnquetePergunta:"", novaEnqueteOpcoes:["",""] });
        break;
      }
      case "encerrarEnquete": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await updateDoc(doc(db, "enquetes", id), { ativa:false });
        render();
        break;
      }
      case "votarEnquete": {
        const id = t.dataset.id, i = +t.dataset.i;
        if(!state.nick.trim()){ alert("Escolha um nome antes de votar."); return; }
        await setDoc(doc(db, "enquete_votos", enqueteVotoId(id, state.uid)), { enqueteId:id, uid:state.uid, opcao:i, ts: Date.now() });
        render();
        break;
      }
    }
  }

  async function doAdminLogin(){
    const email = (state.adminEmail||"").trim();
    const senha = state.adminSenha||"";
    if(!email || !senha){ state.loginError = "Preencha e-mail e senha."; render(); return; }
    try{
      await signInWithEmailAndPassword(auth, email, senha);
      state.adminSenha = "";
      state.loginError = "";
      render();
    }catch(err){
      state.loginError = "E-mail ou senha inválidos.";
      render();
    }
  }

  async function send(){
    const text = (state.input||"").trim();
    if(!text) return;

    const bloqueada = findBlockedWord(text);
    if(bloqueada){
      alert("🚫 Sua mensagem não pode ser enviada porque contém uma palavra bloqueada neste chat.");
      return;
    }
    
    if(state.editingId){
      await updateDoc(doc(db, "mensagens", state.editingId), {
        text,
        edited: true
      });
      state.editingId=null;
    } else {
      await addDoc(collection(db, "mensagens"), {
        author: "me",
        uid: state.uid,
        nick: state.nick,
        avatar: state.avatar,
        text,
        ts: Date.now(),
        reactions: {},
        replyTo: state.replyId || null
      });
      state.replyId=null;

      setTimeout(async ()=>{
        await addDoc(collection(db, "mensagens"), {
          author: "bot",
          nick: BOT.nick,
          avatar: BOT.avatar,
          text: BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)],
          ts: Date.now(),
          reactions: {}
        });
      }, 900+Math.random()*800);
    }
    state.input="";
    render();
  }

  async function shareApp(){
    const url = location.href;
    const data = {title:"ChatVibe",text:"Entre no ChatVibe e converse comigo!",url};
    try{
      if(navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(url); state.shareMsg="Link copiado!"; render(); setTimeout(()=>{state.shareMsg=""; render();},2000); }
    }catch{}
  }

  setInterval(() => {
    if (!state.entered) return;
    let n = Math.floor(Math.random() * ADS.length);
    if (n === state.adIndex) n = (n + 1) % ADS.length;
    state.adIndex = n;
    updateAdOnly();
  }, 7000);

  // Atualiza a tabela do Brasileirão sozinha a cada 5 minutos, enquanto a aba estiver aberta
  setInterval(() => {
    if (state.entered && state.page === "tabela") fetchBrasileirao();
  }, 5*60*1000);

  // Executa o primeiro render logo de cara para abrir a tela de login
  render();
</script>
