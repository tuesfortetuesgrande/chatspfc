  // Marca se o app está sendo aberto já instalado (modo "standalone"),

<script>
  // ============================================================
  // SERVICE WORKER (arquivo real /sw.js) - offline cache e instalação
  // ============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // updateViaCache:'none' impede que o PRÓPRIO arquivo sw.js fique preso no
      // cache HTTP do navegador — sem isso, o app podia nunca perceber que existe
      // uma versão nova do Service Worker pra instalar.
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(reg => console.log('✅ SW registrado:', reg.scope))
        .catch(err => console.warn('⚠️ SW não registrado:', err));
    });

    // Quando o novo Service Worker assume o controle (após um deploy novo),
    // recarrega a página automaticamente pra já entrar com a versão atualizada,
    // sem precisar fechar o app nem limpar cache manualmente.
    let jaRecarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (jaRecarregou) return;
      jaRecarregou = true;
      window.location.reload();
    });
  }
</script>

<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* =====================================================================
     Tricolor Chat — Visual refresh (iOS / WhatsApp clean-light direction)
     Só a camada visual foi modificada. Todas as classes, IDs e variáveis
     originais foram preservadas para não quebrar a lógica JS existente.
     ===================================================================== */
  :root{
    /* Paleta base — off-white neutro estilo iMessage/WhatsApp claro */
    --background:#f2f4f7;
    --foreground:#0b141a;
    --card:#ffffff;
    --muted:#eef1f5;
    --muted-foreground:#667781;
    --border:#e6e8ec;
    --secondary:#f0f2f5;
    --secondary-foreground:#0b141a;
    --primary:#e10600;
    --primary-foreground:#ffffff;
    --accent:#111827;
    --destructive:#dc2626;
    --ring:#e10600;
    --popover:#ffffff;
    --popover-foreground:#0b141a;

    /* Chat — leve textura estilo WhatsApp */
    --chat-bg:#eae6df;
    --bubble-me:#dcf8c6;         /* verdinho tipo WhatsApp para "eu" */
    --bubble-me-fg:#0b141a;
    --bubble-other:#ffffff;
    --bubble-other-fg:#0b141a;

    --gradient-hero:linear-gradient(135deg,#e10600 0%,#a30400 55%,#111 100%);
    --shadow-bubble:0 1px 1.5px rgba(11,20,26,.08);
    --shadow-card:0 1px 2px rgba(11,20,26,.04),0 8px 24px -12px rgba(11,20,26,.08);
    --shadow-header:0 1px 0 rgba(11,20,26,.06);
    --radius-bubble:18px;
  }
  .dark{
    --background:#0b141a;
    --foreground:#e9edef;
    --card:#111b21;
    --muted:#1f2c33;
    --muted-foreground:#8696a0;
    --border:#22343d;
    --secondary:#1f2c33;
    --secondary-foreground:#e9edef;
    --popover:#111b21;
    --popover-foreground:#e9edef;
    --chat-bg:#0a1014;
    --bubble-me:#005c4b;
    --bubble-me-fg:#e9edef;
    --bubble-other:#202c33;
    --bubble-other-fg:#e9edef;
    --shadow-bubble:0 1px 1.5px rgba(0,0,0,.35);
    --shadow-card:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-header:0 1px 0 rgba(255,255,255,.04);
  }

  /* Tipografia estilo iOS/SF, com fallback Inter-like */
  *{
    box-shadow:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  html,body{ text-rendering:optimizeLegibility; }
  body{
    background-color:var(--background);
    color:var(--foreground);
    transition:background-color .25s ease,color .25s ease;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* Header/hero — vermelho tricolor com leve profundidade */
  .gradient-hero{
    background:var(--gradient-hero);
    box-shadow:var(--shadow-header);
  }

  /* Área do chat — pattern discreto tipo WhatsApp */
  .chat-bg-area{
    background-color:var(--chat-bg);
    background-image:
      radial-gradient(circle at 25% 25%, rgba(0,0,0,.025) 1px, transparent 1px),
      radial-gradient(circle at 75% 75%, rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:22px 22px, 22px 22px;
    background-position:0 0, 11px 11px;
  }
  .dark .chat-bg-area{
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.02) 1px, transparent 1px),
      radial-gradient(circle at 75% 75%, rgba(255,255,255,.02) 1px, transparent 1px);
  }

  /* Sombras / cartões */
  .shadow-bubble{ box-shadow:var(--shadow-bubble)!important; }

  /* Scrollbar fininha estilo desktop moderno */
  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}
  .scrollbar-thin::-webkit-scrollbar-track{background:transparent}
  .scrollbar-thin::-webkit-scrollbar-thumb{
    background:color-mix(in oklab, var(--muted-foreground) 35%, transparent);
    border-radius:10px;
  }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover{
    background:color-mix(in oklab, var(--muted-foreground) 55%, transparent);
  }

  /* Animações mais suaves e naturais */
  @keyframes slideUp{
    from{transform:translateY(10px) scale(.98);opacity:0}
    to{transform:translateY(0) scale(1);opacity:1}
  }
  @keyframes slideLeft{
    from{transform:translateX(100%);opacity:.6}
    to{transform:translateX(0);opacity:1}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{
    0%{transform:scale(.9);opacity:0}
    60%{transform:scale(1.02);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  .anim-slide-up{animation:slideUp .28s cubic-bezier(0.22,1,0.36,1) forwards}
  .anim-slide-left{animation:slideLeft .32s cubic-bezier(0.22,1,0.36,1) forwards}
  .anim-fade{animation:fadeIn .2s ease forwards}

  /* ===== Classes utilitárias mapeadas para tokens (mantidas iguais) ===== */
  .bg-card { background-color: var(--card); }
  .bg-background { background-color: var(--background); }
  .bg-secondary { background-color: var(--secondary); }
  .bg-muted { background-color: var(--muted); }
  .bg-popover { background-color: var(--popover); }
  .bg-primary { background-color: var(--primary); }
  .bg-destructive { background-color: var(--destructive); }

  .text-foreground { color: var(--foreground); }
  .text-muted-foreground { color: var(--muted-foreground); }
  .text-primary { color: var(--primary); }
  .text-primary-foreground { color: var(--primary-foreground); }
  .text-popover-foreground { color: var(--popover-foreground); }
  .text-secondary-foreground { color: var(--secondary-foreground); }
  .text-destructive { color: var(--destructive); }

  .border-border { border-color: var(--border); }
  .ring-ring { --tw-ring-color: var(--ring); }

  /* ===== Refinamentos visuais globais (não mexem em estrutura) ===== */

  /* Cards com sombra sutil moderna */
  .bg-card, .bg-popover{
    box-shadow: var(--shadow-card);
  }

  /* Bordas mais suaves em cantos pequenos */
  .rounded-lg{ border-radius:12px; }
  .rounded-xl{ border-radius:16px; }
  .rounded-2xl{ border-radius:20px; }

  /* Balões de chat com raio maior tipo iMessage/WhatsApp */
  [style*="var(--bubble-me)"], [style*="var(--bubble-other)"]{
    border-radius:var(--radius-bubble)!important;
    line-height:1.35;
    letter-spacing:.005em;
  }
  /* Preserva o "rabinho" da bolha (o JS já ajusta o canto pequeno via inline style) */
  [style*="border-top-right-radius:4px"]{ border-top-right-radius:6px!important; }
  [style*="border-top-left-radius:4px"]{ border-top-left-radius:6px!important; }

  /* Inputs / textareas — foco estilo iOS */
  input, textarea, select, button{
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    box-shadow:0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent)!important;
    border-color:var(--ring)!important;
    transition:box-shadow .15s ease, border-color .15s ease;
  }

  /* Botões — micro-interação */
  button{
    transition: transform .12s ease, background-color .18s ease, opacity .18s ease, filter .18s ease;
  }
  button:active{ transform:scale(.97); }
  button:hover:not(:disabled){ filter:brightness(1.03); }

  /* Botão primário com leve gradiente */
  .bg-primary{
    background-image:linear-gradient(180deg,
      color-mix(in oklab, var(--primary) 100%, white 6%),
      var(--primary));
  }

  /* Header sticky com blur — feeling nativo iOS */
  header.gradient-hero{
    backdrop-filter:saturate(140%);
    -webkit-backdrop-filter:saturate(140%);
  }

  /* Divisores mais discretos */
  hr, .border-t, .border-b, .border{
    border-color:var(--border);
  }

  /* Seleção de texto na cor da marca */
  ::selection{
    background:color-mix(in oklab, var(--primary) 30%, transparent);
    color:var(--foreground);
  }

  /* Estado "digitando" e badges — pequeno polish */
  .anim-fade + *{ transition:opacity .2s ease; }

  /* Bolinha "online" pulsante — feeling nativo iMessage/WhatsApp */
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,.55); }
    50%{ box-shadow:0 0 0 6px rgba(34,197,94,0); }
  }
  .online-dot{
    display:inline-block; width:8px; height:8px; border-radius:9999px;
    background:#22c55e; animation:pulseDot 2s ease-out infinite;
  }
  .online-ring{
    position:absolute; bottom:-2px; right:-2px;
    width:14px; height:14px; border-radius:9999px;
    background:#22c55e; border:2px solid var(--card);
  }
  .dark .online-ring{ border-color:var(--card); }

  /* Linha divisória sutil no topo do subheader do app */
  .subheader-bar{
    background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.05)), var(--gradient-hero);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  /* Botão de ícone circular estilo iOS (usado no header) */
  .ios-icon-btn{
    height:38px; width:38px; border-radius:9999px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.14);
    color:#fff;
    transition:background .18s ease, transform .12s ease;
  }
  .ios-icon-btn:hover{ background:rgba(255,255,255,.24); }
  .ios-icon-btn:active{ transform:scale(.94); }

  /* Item da tela de configurações */
  .settings-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:14px;
    background:var(--card);
    transition:background .15s ease;
    cursor:pointer;
  }
  .settings-row:hover{ background:var(--secondary); }
  .settings-row .settings-icon{
    height:38px; width:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; flex-shrink:0;
  }

  /* =====================================================================
     CAPA DO PERFIL (estilo Facebook) — foto de fundo atrás do avatar
     ===================================================================== */
  .profile-cover{
    height:108px;
    background-size:cover;
    background-position:center;
    position:relative;
  }
  .profile-cover-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,.12) 45%, rgba(0,0,0,.6) 100%);
  }
  .profile-avatar-wrap{
    position:relative;
  }
  .profile-avatar-wrap img{
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }

  /* =====================================================================
     NAVEGAÇÃO LATERAL — visual de "abas" com efeito de toque/hover
     ===================================================================== */
  .nav-drawer-wrap{
    background:color-mix(in oklab, var(--card) 88%, transparent);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow-card);
    padding:6px;
  }
  .nav-item{
    position:relative;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .2s ease, transform .12s ease;
  }
  .nav-item:hover{ background:var(--secondary); }
  .nav-item:active{ transform:scale(.97); background:var(--secondary); }
  .nav-item.is-active{
    background:color-mix(in oklab, var(--primary) 9%, var(--secondary));
  }
  .nav-item .nav-item-icon{
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .nav-item:hover .nav-item-icon{ transform:scale(1.08); }
  @keyframes navIconPop{
    0%{ transform:scale(.75) rotate(-6deg); opacity:.4; }
    60%{ transform:scale(1.12) rotate(2deg); }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .nav-item.is-active .nav-item-icon{
    animation:navIconPop .34s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes navGlowIn{
    from{ transform:scaleX(.8); opacity:0; }
    to{ transform:scaleX(1); opacity:1; }
  }
  .nav-item.is-active::before{
    content:"";
    position:absolute; inset:0;
    border-radius:14px;
    background:linear-gradient(90deg, color-mix(in oklab, var(--primary) 16%, transparent), transparent 70%);
    transform-origin:left center;
    animation:navGlowIn .3s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  @keyframes navBarGrow{
    from{ transform:scaleY(0); opacity:0; }
    to{ transform:scaleY(1); opacity:1; }
  }
  .nav-item-indicator{
    position:absolute; left:2px; top:8px; bottom:8px;
    width:3px; border-radius:9999px;
    background:var(--gradient-hero);
    transform-origin:center;
  }
  .nav-item.is-active .nav-item-indicator{
    animation:navBarGrow .3s cubic-bezier(.22,1,.36,1);
  }
  .nav-badge{
    display:inline-block; width:8px; height:8px; border-radius:9999px;
    background:#ef4444; box-shadow:0 0 0 2px var(--card);
    animation:pulseDot 2s ease-out infinite;
    flex-shrink:0;
  }


  /* Quando o teclado do chat está aberto, esconde o hero grande */
  body.chat-keyboard-open #app-hero {
    display: none !important;
  }

  /* ===================== QUIZ SÃO PAULO FC — visual premium ===================== */
  :root{
    --quiz-red:#D50000;
    --quiz-red-dark:#8f0000;
    --quiz-black:#111111;
    --quiz-gray:#222222;
    --quiz-white:#FFFFFF;
  }
  .quiz-shell{
    position:relative; border-radius:20px; overflow:hidden;
    background:var(--quiz-black); color:var(--quiz-white);
    min-height:100%;
    isolation:isolate;
  }
  .quiz-stadium-bg{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(213,0,0,.35), transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(213,0,0,.25), transparent 50%),
      linear-gradient(180deg, #1a1a1a 0%, #111111 55%, #000000 100%);
    overflow:hidden;
  }
  .quiz-stadium-bg::before{
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 34px);
    opacity:.5;
  }
  .quiz-glow{
    position:absolute; border-radius:9999px; filter:blur(40px); opacity:.55; pointer-events:none;
    background:radial-gradient(circle, rgba(213,0,0,.9), transparent 70%);
    animation:quizGlowPulse 4.5s ease-in-out infinite;
  }
  @keyframes quizGlowPulse{ 0%,100%{opacity:.35; transform:scale(1);} 50%{opacity:.65; transform:scale(1.15);} }
  .quiz-particle{
    position:absolute; bottom:-10px; border-radius:9999px; pointer-events:none;
    background:rgba(255,255,255,.55);
    animation:quizFloatUp linear infinite;
  }
  @keyframes quizFloatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-420px) translateX(var(--drift,20px)); opacity:0; }
  }
  .quiz-content{ position:relative; z-index:1; }
  .quiz-flag-strip{
    height:4px; width:100%;
    background:repeating-linear-gradient(90deg, var(--quiz-red) 0 16px, var(--quiz-white) 16px 24px, var(--quiz-black) 24px 40px);
  }
  .quiz-btn-primary{
    background:linear-gradient(135deg, var(--quiz-red) 0%, var(--quiz-red-dark) 100%);
    color:#fff; font-weight:800; letter-spacing:.02em;
    box-shadow:0 8px 24px -8px rgba(213,0,0,.7), inset 0 1px 0 rgba(255,255,255,.15);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .quiz-btn-primary:active{ transform:scale(.97); }
  .quiz-btn-pulse{ animation:quizBtnPulse 1.8s ease-in-out infinite; }
  @keyframes quizBtnPulse{
    0%,100%{ box-shadow:0 8px 24px -8px rgba(213,0,0,.7), 0 0 0 0 rgba(213,0,0,.5); }
    50%{ box-shadow:0 8px 30px -6px rgba(213,0,0,.9), 0 0 0 10px rgba(213,0,0,0); }
  }
  .quiz-btn-secondary{
    background:rgba(255,255,255,.08); color:#fff; font-weight:700;
    border:1px solid rgba(255,255,255,.18);
    transition:background .15s ease;
  }
  .quiz-btn-secondary:active{ background:rgba(255,255,255,.16); }
  .quiz-card{
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:18px; backdrop-filter:blur(6px);
  }
  .quiz-phase-card{
    position:relative; border-radius:18px; overflow:hidden; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1.5px solid rgba(255,255,255,.12);
    transition:transform .18s cubic-bezier(.22,1,.36,1), border-color .18s ease;
  }
  .quiz-phase-card.is-current{ border-color:var(--quiz-red); box-shadow:0 0 0 3px rgba(213,0,0,.25); }
  .quiz-phase-card:not(.is-locked):active{ transform:scale(.96); }
  .quiz-phase-card.is-locked{ opacity:.5; filter:grayscale(.6); }
  .quiz-option-btn{
    text-align:left; border-radius:14px; padding:14px 16px;
    border:1.5px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#fff;
    display:flex; align-items:center; gap:12px; transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .quiz-option-btn:not(:disabled):active{ transform:scale(.985); }
  .quiz-option-letter{
    flex-shrink:0; width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.8rem; background:rgba(255,255,255,.12);
  }
  .quiz-option-correct{ background:rgba(34,197,94,.22)!important; border-color:#22c55e!important; }
  .quiz-option-correct .quiz-option-letter{ background:#22c55e; color:#111; }
  .quiz-option-wrong{ background:rgba(239,68,68,.22)!important; border-color:#ef4444!important; }
  .quiz-option-wrong .quiz-option-letter{ background:#ef4444; color:#fff; }
  .quiz-timer-wrap{ position:relative; height:8px; border-radius:9999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .quiz-timer-bar{ height:100%; border-radius:9999px; background:linear-gradient(90deg, var(--quiz-red), #ff5252); transition:width 1s linear; }
  .quiz-timer-bar.quiz-timer-danger{ background:linear-gradient(90deg, #ff1744, #ff8a80); animation:quizTimerDanger .5s ease-in-out infinite; }
  @keyframes quizTimerDanger{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
  .quiz-progress-dots{ display:flex; gap:4px; }
  .quiz-progress-dot{ flex:1; height:6px; border-radius:9999px; background:rgba(255,255,255,.15); }
  .quiz-progress-dot.is-correct{ background:#22c55e; }
  .quiz-progress-dot.is-wrong{ background:#ef4444; }
  .quiz-progress-dot.is-current{ background:var(--quiz-red); }
  .quiz-shake{ animation:quizShake .4s ease; }
  @keyframes quizShake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-6px); }

  // completo do chat como texto puro. Esse texto é atribuído diretamente à propriedade
  // .srcdoc do iframe via JavaScript (não como atributo HTML) em render(), o que faz o
  // iframe herdar a MESMA origem da página principal — por isso localStorage e a
  // persistência do Firebase Auth funcionam normalmente lá dentro. (Com "data:" URI ou
  // Blob URL, alguns navegadores tratam o iframe como origem "opaca"/bloqueada, o que
  // quebrava o React silenciosamente e deixava a tela em branco.)
  function decodeBase64Utf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

function fatoDoDia(){
  const hoje = new Date();
  const inicioDoAno = new Date(hoje.getFullYear(), 0, 0);
  const diaDoAno = Math.floor((hoje - inicioDoAno) / 86400000);
  return FATOS_DIARIOS[diaDoAno % FATOS_DIARIOS.length];
}

  function jogoId(j){

  // Identificador do visitante. Como o login anônimo do Firebase foi desativado
  // (propositalmente, pra evitar que gente sem cadastro participasse do chat sem querer),
  // quem NÃO tem cadastro (e-mail/senha) passa a usar um ID local, gerado uma vez e
  // guardado no navegador (localStorage) — assim ele participa do bolão/enquete e aparece
  // no ranking normalmente, sem precisar de conta. Quem estiver logado com e-mail/senha
  // (cadastrado) usa o uid real do Firebase (ver onAuthStateChanged(auth,...) mais abaixo,
  // que sobrescreve esse valor quando detecta uma sessão de conta cadastrada).
  function getUid(){
    try{
      let gid = localStorage.getItem("spfc_guest_uid");
      if(!gid){
        gid = "guest_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
        localStorage.setItem("spfc_guest_uid", gid);
      }
      return gid;
    }catch(e){
      // localStorage indisponível (ex: modo anônimo do navegador) — gera um id só pra essa sessão
      return "guest_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    }
  }

  // Só é admin quem logou com e-mail/senha (ou Google) — nunca o usuário anônimo.
  function isAdmin(user){
    return !!user && !user.isAnonymous;
  }

  function loadQuizStreak(){
    try{
      const raw = localStorage.getItem("spfc_quiz_streak");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { streak:0, melhorSequencia:0, lastPlayedDate:null, totalAcertos:0 };
  }

  function updateQuizStreak(scoreDaRodada){
    const todayStr = new Date().toISOString().slice(0,10);
    const s = { ...state.quizStreak };
    if(s.lastPlayedDate !== todayStr){
      const ontemStr = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      s.streak = (s.lastPlayedDate === ontemStr) ? (s.streak||0)+1 : 1;
      s.lastPlayedDate = todayStr;
    }
    s.melhorSequencia = Math.max(s.melhorSequencia||0, s.streak);
    s.totalAcertos = (s.totalAcertos||0) + scoreDaRodada;
    localStorage.setItem("spfc_quiz_streak", JSON.stringify(s));
    state.quizStreak = s;
    if(state.nick.trim()){
      setDoc(doc(db, "quiz_ranking", state.uid), { nick: state.nick, totalAcertos: s.totalAcertos, melhorSequencia: s.melhorSequencia }, { merge:true }).catch(()=>{});
    }
  }

  /* Sons curtos gerados via Web Audio API — sem depender de arquivos externos */
  let quizAudioCtx = null;
  function quizPlaySound(type){
    if(!state.quizProgress.som) return;
    try{
      quizAudioCtx = quizAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const ctx = quizAudioCtx;
      const now = ctx.currentTime;
      const tocarTom = (freq, inicio, duracao, tipo="sine", ganho=0.15)=>{
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = tipo; osc.frequency.setValueAtTime(freq, now+inicio);
        gain.gain.setValueAtTime(0, now+inicio);
        gain.gain.linearRampToValueAtTime(ganho, now+inicio+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now+inicio+duracao);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now+inicio); osc.stop(now+inicio+duracao+0.02);
      };
      if(type==="click") tocarTom(500,0,0.08,"square",0.08);
      else if(type==="correct"){ tocarTom(523,0,0.12); tocarTom(659,0.1,0.12); tocarTom(784,0.2,0.18); }

    ];
    for(const url of urls){
      try{
        const res = await fetch(url);
        if(!res.ok) continue;
        const json = await res.json();
        const group = (json.children && json.children[0]) || json;
        const entries = (group && group.standings && group.standings.entries) || (json.standings && json.standings.entries) || [];
        if(entries.length){
          const parsed = entries.map(e=>{
            const statByName = {};
            (e.stats||[]).forEach(s=>{ statByName[s.name]=s; });
            return {
              team: (e.team && (e.team.displayName||e.team.name)) || "?",
              crest: (e.team && e.team.logos && e.team.logos[0] && e.team.logos[0].href) || "",
              rank: statByName.rank ? statByName.rank.value : null,
              pj: statByName.gamesPlayed ? statByName.gamesPlayed.displayValue : "-",
              v: statByName.wins ? statByName.wins.displayValue : "-",
              e: statByName.ties ? statByName.ties.displayValue : "-",
              d: statByName.losses ? statByName.losses.displayValue : "-",
              sg: statByName.pointDifferential ? statByName.pointDifferential.displayValue : "-",
              pts: statByName.points ? statByName.points.displayValue : "-",
            };
          });
          parsed.sort((a,b)=>(a.rank??999)-(b.rank??999));
          state.brasileirao = { loading:false, error:null, entries:parsed, updatedAt:Date.now() };
          render();
          return;
        }
      }catch(err){ /* tenta a próxima URL */ }
    }
    state.brasileirao = { loading:false, error:"Não foi possível carregar a tabela agora. Toque em Atualizar para tentar de novo.", entries: state.brasileirao.entries||null, updatedAt: state.brasileirao.updatedAt||null };
    render();
  }

  // ESCUTANDO MENSAGENS EM TEMPO REAL DO FIRESTORE
  // Virou uma função "religável": se a primeira tentativa de leitura acontecer antes do
  // login terminar de confirmar (auth ainda não pronto), o listener pode morrer em silêncio
  // por falta de permissão. Por isso essa função é chamada de novo sempre que o estado de
  // login mudar de verdade (ver onAuthStateChanged(auth,...) mais abaixo), cancelando o
  // listener anterior antes de criar um novo — sem isso, o post só aparecia depois de um F5.
  let unsubMensagens = null;
  function ligarMensagens(){
    if (unsubMensagens) { unsubMensagens(); unsubMensagens = null; }
    const qMessages = query(collection(db, "mensagens"), orderBy("ts", "asc"), limitToLast(50));
    unsubMensagens = onSnapshot(qMessages, (snapshot) => {
      const msgs = [];
      snapshot.forEach((doc) => {
        msgs.push({ id: doc.id, ...doc.data() });
      });
      state.messages = msgs;
      render();
    }, (err) => {
      console.error("Erro ao carregar mensagens do chat (confira as regras de LEITURA de 'mensagens'):", err);
    });
  }
  ligarMensagens();

  // ESCUTANDO OS PLACARES DOS JOGOS EM TEMPO REAL (aparece pra todo mundo assim que você salva)
  onSnapshot(collection(db, "placares"), (snapshot) => {
    const placares = {};
    snapshot.forEach((doc) => { placares[doc.id] = doc.data(); });
    state.placares = placares;
    render();
  });

  // ESCUTANDO O LOGIN DO ADMINISTRADOR — instância separada (adminAuth), nunca se mistura
  // com a sessão do visitante logado no app.
  onAuthStateChanged(adminAuth, (user) => {
    state.user = user;
    render();
  });

  // ESCUTANDO O LOGIN DO VISITANTE/FÓRUM — usa o MESMO projeto Firebase do ChatMSN
  // (mesmo banco de dados), mas a entrada continua simples: nick + avatar, sem senha.
  // O login anônimo foi desativado de propósito (ver conversa anterior), então quem NÃO
  // tem cadastro (e-mail/senha) segue usando o id local gerado por getUid() (já setado em
  // state.uid na criação do state). Se detectarmos uma sessão de conta cadastrada (e-mail/
  // senha) ativa nesse mesmo domínio, aí sim trocamos state.uid pelo uid real do Firebase —
  // isso é só um bônus pra quem tem conta; quem não tem continua funcionando normalmente
  // com o id local, inclusive aparecendo no ranking do bolão/enquete.
  // Guarda o último uid "de conta" visto, pra só religar os feeds quando o login mudar
  // DE VERDADE (entrou numa conta / trocou de conta) — evita religar toda vez que o Firebase
  // dispara esse callback de novo com o mesmo usuário.
  let ultimoUidDeConta = null;
  onAuthStateChanged(auth, (user) => {
    const uidDeConta = (user && !user.isAnonymous) ? user.uid : null;
    if(user && !user.isAnonymous){
      state.uid = user.uid;
      state.isGuest = false;
      render();
      // Reenvia a identidade pro chat: sem isso o iframe continuava usando o id
      // provisório de visitante e as consultas de amizade eram negadas pelas regras.
      try { syncChatIdentity(); } catch (e) {}
    }
    // Sem sessão cadastrada: mantém o id local (guest) que já está em state.uid.

    ultimoUidDeConta = uidDeConta;
    // Religa os feeds que dependem de permissão de leitura já confirmada — cobre o caso
    // clássico em que a página carrega, os listeners tentam ler antes do login confirmar,
    // a leitura é negada em silêncio, e só um F5 (ou logout/login) religava tudo de novo.
    // IMPORTANTE: isso roda em TODO disparo do onAuthStateChanged, não só quando o uid de
    // conta muda — porque pra quem entra como visitante (uidDeConta sempre null, já que
    // login anônimo está desativado) a comparação "mudou?" nunca era verdadeira, então o
    // listener que nasceu morto (por causa da corrida contra a confirmação do login) nunca
    // era religado. Era exatamente esse o motivo do fórum só atualizar depois de sair e
    // entrar de novo numa conta cadastrada.
    ligarMensagens();
    ligarForumPosts();
    ligarQuizRanking();
  });

  // ESCUTANDO OS BOLÕES ABERTOS PELO ADMINISTRADOR (um por jogo)
  onSnapshot(collection(db, "boloes"), (snapshot) => {
    const boloes = {};
    snapshot.forEach((doc) => { boloes[doc.id] = doc.data(); });
    state.boloes = boloes;
    render();
  });

  // ===== FÓRUM: posts (só texto) e stories (só foto), em tempo real =====
  const forumCommentUnsubs = {}; // postId -> função de cancelar o listener de comentários

  // Mesmo motivo do chat: função religável, chamada de novo quando o login mudar de verdade.
  let unsubForumPosts = null;
  function ligarForumPosts(){
    if (unsubForumPosts) { unsubForumPosts(); unsubForumPosts = null; }
    unsubForumPosts = onSnapshot(query(collection(db, "forum_posts"), orderBy("ts","desc"), limit(80)), (snapshot) => {
      state.forumPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      // Se as regras do Firestore bloquearem a LEITURA de forum_posts, o Firebase
      // não lança um erro visível na tela — ele só cai aqui, em silêncio, e o fórum
      // fica vazio mesmo com posts existindo no banco. Logamos no console pra facilitar o diagnóstico.
      console.error("Erro ao carregar posts do fórum (confira as regras de LEITURA de 'forum_posts'):", err);
    });
  }
  ligarForumPosts();

  onSnapshot(collection(db, "forum_stories"), (snapshot) => {
    const now = Date.now();
    state.forumStories = snapshot.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(s => !s.expiresAt || s.expiresAt > now)
      .sort((a,b) => b.ts - a.ts);
    render();
  }, (err) => {
    console.error("Erro ao carregar stories do fórum (confira as regras de LEITURA de 'forum_stories'):", err);
  });

  // ESCUTANDO OS PALPITES DE TODO MUNDO (pra calcular o ranking do bolão)
  onSnapshot(collection(db, "palpites"), (snapshot) => {
    const palpites = {};
    snapshot.forEach((doc) => { palpites[doc.id] = doc.data(); });
    state.palpites = palpites;
    render();
  });

  // ESCUTANDO AS ENQUETES CRIADAS PELO ADMINISTRADOR
  onSnapshot(collection(db, "enquetes"), (snapshot) => {
    const enquetes = [];
    snapshot.forEach((doc) => { enquetes.push({ id: doc.id, ...doc.data() }); });
    enquetes.sort((a,b) => (b.criadaEm||0) - (a.criadaEm||0));
    state.enquetes = enquetes;
    render();
  });

  // ESCUTANDO OS VOTOS DAS ENQUETES
  onSnapshot(collection(db, "enquete_votos"), (snapshot) => {
    const votos = {};
    snapshot.forEach((doc) => { votos[doc.id] = doc.data(); });
    state.enqueteVotos = votos;
    render();
  });

  // ESCUTANDO O RANKING DO QUIZ (quem mais acerta perguntas ao longo do tempo)
  // Mesmo motivo do chat e do fórum: função religável.
  let unsubQuizRanking = null;
  function ligarQuizRanking(){
    if (unsubQuizRanking) { unsubQuizRanking(); unsubQuizRanking = null; }
    unsubQuizRanking = onSnapshot(collection(db, "quiz_ranking"), (snapshot) => {
      const ranking = [];
      snapshot.forEach((doc) => { ranking.push({ uid: doc.id, ...doc.data() }); });
      ranking.sort((a,b) => (b.totalAcertos||0) - (a.totalAcertos||0));
      state.quizRanking = ranking.slice(0, 10);
      render();
    }, (err) => {
      console.error("Erro ao carregar ranking do quiz (confira as regras de LEITURA de 'quiz_ranking'):", err);
    });
  }
  ligarQuizRanking();

  /* ===================== RENDER ===================== */
  // Recebe avisos do chat (dentro do iframe) sobre o teclado abrir/fechar,
  // e esconde o cabeçalho grande + a barra de anúncio pra dar mais espaço ao chat.
  window.addEventListener("message", (ev) => {
    if (!ev.data || !ev.data.type) return;
    if (ev.data.type === "spfc-chat-keyboard") {
      document.body.classList.toggle("chat-keyboard-open", !!ev.data.open);
      // O toggle acima pode mudar a altura do #app-hero (ele some quando o
      // teclado abre), o que muda o tamanho/posição do slot do chat. Reposiciona
      // o iframe depois que o layout se ajustar.
      requestAnimationFrame(positionChatFrame);
    } else if (ev.data.type === "spfc-open-signup") {
      // O chat pediu cadastro: volta pra tela de nick/avatar já na aba "criar cadastro".
      document.body.classList.remove("chat-keyboard-open");
      setState({ entered:false, showGuestInfo:false, authMode:"signup", authError:"", menuOpen:false });
    } else if (ev.data.type === "spfc-chat-ready") {
      // O chat (dentro do iframe) avisou que já está pronto pra receber o
      // nick/avatar escolhidos na tela "nick e avatar" deste app principal.
      syncChatIdentity();
    }
  });

  // Envia pro iframe do chat o nick/avatar/uid ATUAIS escolhidos na tela de
  // nick e avatar deste app, pra que as mensagens enviadas lá dentro usem o
  // mesmo nome exibido no perfil (aba lateral), em vez do nick genérico
  // "Usuário" do sistema de login próprio do chat.
  function syncChatIdentity(){
    const host = chatFrameHost;
    const frame = host && host.querySelector("#msnChatFrame");
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({
      type: "spfc-user-identity",
      nick: state.nick,
      avatar: state.avatar,
      uid: state.uid,
      guest: !!state.isGuest
    }, "*");
  }

  // ===== "Casa" permanente do iframe do chat, FORA do #app =====
  // O <iframe id="msnChatFrame"> é criado UMA ÚNICA VEZ e nunca é
  // reanexado (appendChild) a um novo elemento pai depois disso — mover um
  // <iframe> de lugar no DOM faz o navegador recarregar o documento dele do
  // zero, o que reiniciava o chat (e disparava de novo o som/aviso "entrando
  // online") toda vez que o usuário saía da aba Chat e voltava, ou entrava em
  // qualquer outra aba do app.
  // Em vez de mover o iframe pra dentro do slot reservado a cada render(),
  // ele fica sempre fixo fora do #app e é apenas "desenhado por cima" da
  // posição exata do slot (via position:fixed + coordenadas calculadas),
  // ficando escondido (display:none) quando a aba do chat não está ativa.
  // ===== DESBLOQUEIO DE ÁUDIO DO CHAT (iframe) VIA TOQUE NO APP EXTERNO =====
  // O chat roda dentro de um <iframe srcdoc>, que é um DOCUMENTO separado pro
  // navegador — o desbloqueio de autoplay de um documento não vale pro outro.
  // No fluxo real do celular, o primeiro toque do usuário (escolher nick/avatar,
  // tocar na aba "Chat") acontece neste app EXTERNO, nunca dentro do iframe. Sem
  // esse aviso, o iframe só via um toque "de verdade" depois que o toast
  // automático "entrando online" já tinha tentado tocar (e falhado, caindo no
  // bipe sintetizado). Aqui a gente repassa esse toque pro iframe via
  // postMessage assim que ele acontece — e reforça de novo quando o iframe
  // termina de carregar, caso o toque tenha ocorrido antes de o iframe existir.
  let userGestureHappened = false;
  function sendAudioUnlockToChat(){
    const host = chatFrameHost;
    const frame = host && host.querySelector("#msnChatFrame");
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: "spfc-unlock-audio" }, "*");
  }
  ["pointerdown", "touchstart", "click"].forEach(evt => {
    document.addEventListener(evt, () => {
      userGestureHappened = true;
      sendAudioUnlockToChat();
    }, { once: true, passive: true });
  });

  let chatFrameHost = null;
  function ensureChatFrameHost(){
    if (!chatFrameHost) {
      chatFrameHost = document.createElement("div");
      chatFrameHost.id = "msnChatFrameHost";
      // "transform:translateZ(0)" força esse host a virar sua própria camada de
      // composição (GPU). Sem isso, alguns navegadores/WebViews (é o que parece
      // acontecer no fluxo "sem cadastro") deixam o iframe "pintado em branco"
      // mesmo depois de ficar visível com conteúdo carregado — só um reflow
      // forçado (como trocar de aba e voltar) resolvia. Isso evita o problema
      // na raiz, e o reforço logo abaixo (positionChatFrame duplo) cobre o resto.
      chatFrameHost.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:25;display:none;pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;";
      document.body.appendChild(chatFrameHost);
      const frame = document.createElement("iframe");
      frame.id = "msnChatFrame";
      frame.title = "Chat";
      frame.className = "w-full h-full border-0 block";
      frame.setAttribute("allow", "autoplay; clipboard-write");
      chatFrameHost.appendChild(frame);
    }
    return chatFrameHost;
  }

  // Recalcula e aplica a posição/tamanho do host do iframe por cima do
  // #msnChatSlot (só quando a aba do chat está ativa); do contrário, esconde.
  function positionChatFrame(){
    const host = chatFrameHost;
    if (!host) return;
    const slot = document.getElementById("msnChatSlot");
    if (state.entered && state.page === "chat" && slot) {
      const r = slot.getBoundingClientRect();
      host.style.left = r.left + "px";
      host.style.top = r.top + "px";
      host.style.width = r.width + "px";
      host.style.height = r.height + "px";
      host.style.display = "block";
      host.style.pointerEvents = "auto";
    } else {
      host.style.display = "none";
      host.style.pointerEvents = "none";
    }
  }
  window.addEventListener("resize", () => positionChatFrame());
  window.addEventListener("orientationchange", () => requestAnimationFrame(positionChatFrame));
  // Corrige o caso em que o layout (altura real da tela no mobile, imagens,
  // fontes) só "assenta" um instante depois do primeiro render: sem isso, o
  // iframe do chat podia ficar com posição/tamanho desatualizados até o
  // usuário mexer em algo (abrir/fechar o menu) que forçasse um novo cálculo.
  window.addEventListener("load", () => requestAnimationFrame(positionChatFrame));
  if (typeof ResizeObserver !== "undefined") {
    const chatPositionObserver = new ResizeObserver(() => positionChatFrame());
    chatPositionObserver.observe(document.body);
  }

  function render(){
    applyDark(); applyTheme();

    const host = ensureChatFrameHost();

    $("#app").innerHTML = state.entered ? appView() : (state.showGuestInfo ? guestInfoView() : loginView());
    bind();

    // Se a página atual é o chat, garante que o iframe (sempre o mesmo,
    // nunca recriado nem reanexado) já foi carregado e reposiciona o host
    // por cima do slot reservado.
    if (state.entered && state.page==="chat") {
      const sc = $("#scrollArea"); if(sc) sc.scrollTop = sc.scrollHeight;
      const frame = host.querySelector("#msnChatFrame");
      if (frame && !frame.dataset.loaded) {
        frame.srcdoc = MSN_CHAT_HTML;
        frame.dataset.loaded = "1";
        // Assim que o iframe carregar, manda o nick/avatar atuais pra ele
        // (o chat também pede isso sozinho via "spfc-chat-ready", esse é
        // só um reforço caso essa mensagem chegue antes do listener dele).
        frame.addEventListener("load", () => setTimeout(syncChatIdentity, 300));
        // Reforço: se o toque do usuário já tinha acontecido antes do iframe
        // terminar de carregar (caso comum — nick/avatar são escolhidos antes),
        // a mensagem enviada naquele momento não tinha ninguém ouvindo do lado
        // de dentro ainda. Reenviamos agora que o iframe está pronto.
        frame.addEventListener("load", () => { if (userGestureHappened) setTimeout(sendAudioUnlockToChat, 300); });
        // Detecção direta (mais confiável que postMessage): como o iframe usa
        // srcdoc, ele herda a mesma origem da página principal, então dá pra
        // "escutar" o foco dos campos de texto de dentro dele diretamente.
        // Isso garante que o modo "teclado aberto" seja ativado mesmo que o
        // aviso via postMessage não chegue por algum motivo.
        frame.addEventListener("load", () => {
          try {
            const doc = frame.contentDocument;
            if (!doc) return;
            const isField = (el) => !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
            doc.addEventListener("focusin", (e) => {
              if (isField(e.target)) { document.body.classList.add("chat-keyboard-open"); requestAnimationFrame(positionChatFrame); }
            });
            doc.addEventListener("focusout", () => {
              setTimeout(() => {
                if (!isField(doc.activeElement)) { document.body.classList.remove("chat-keyboard-open"); requestAnimationFrame(positionChatFrame); }
              }, 100);
            });
          } catch (err) { /* se por algum motivo não der acesso direto, o postMessage cobre */ }
        });
      }
    }
    positionChatFrame();

    // Reforço específico pro bug do visitante (sem cadastro): quem faz login com
    // cadastro ganha "de graça" um segundo render() (via onAuthStateChanged do
    // Firebase) logo depois de entrar, e isso força um reflow que "acorda" o
    // iframe. Quem entra como visitante nunca dispara esse segundo render, então
    // o iframe pode ficar visualmente em branco até algo forçar um novo reflow
    // (por isso trocar de aba e voltar "resolvia" na prática). Aqui simulamos
    // esse reflow manualmente sempre que entramos no chat, cobrindo os dois casos.
    if (state.entered && state.page === "chat") {
      requestAnimationFrame(() => {
        positionChatFrame();
        requestAnimationFrame(() => positionChatFrame());
      });
    }

    updateAdOnly();
  }

function updateAdOnly() {

  adContainer.innerHTML = `

        <button class="text-[10px] font-bold bg-white/20 backdrop-blur-sm border border-white/30 rounded px-3 py-1 shrink-0 hover:bg-white/30 transition">
          ${esc(ad.cta)}

      </div>
      <div class="flex justify-center gap-1 mt-1">
        ${ADS.map((_,i)=>`<span class="h-1 rounded-full transition-all ${i===state.adIndex?'w-4 bg-gray-400':'w-1 bg-gray-300'}"></span>`).join("")}
      </div>
    </a>
  `;
}

  function loginView(){

        <p class="text-sm font-medium mt-5 mb-2 text-foreground">Escolha seu avatar</p>

        </div>

          <div class="flex gap-2 p-1 rounded-xl bg-secondary">

  function shareModal(){
    const url = location.href;
    const text = "Entre no Chat Tú és Forte, Tú és Grande e vem torcer com a gente!";
    const enc = encodeURIComponent;
    const options = [
      {key:"whatsapp", label:"WhatsApp", icon:"whatsapp", href:`https://wa.me/?text=${enc(text+" "+url)}`, bg:"#25D366"},
      {key:"facebook", label:"Facebook", icon:"facebook", href:`https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`, bg:"#1877F2"},
      {key:"x", label:"X / Twitter", icon:"x", href:`https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}`, bg:"#000000"},
      {key:"telegram", label:"Telegram", icon:"telegram", href:`https://t.me/share/url?url=${enc(url)}&text=${enc(text)}`, bg:"#26A5E4"},
      {key:"email", label:"E-mail", icon:"mail", href:`mailto:?subject=${enc("Chat Tú és Forte, Tú és Grande")}&body=${enc(text+" "+url)}`, bg:"#6b7280"},
    ];
    return `<div data-act="closeShare" class="absolute inset-0 z-40 bg-black/60 flex items-center justify-center p-4 anim-fade">
      <div data-stop class="w-full max-w-sm rounded-3xl bg-card p-6 shadow-2xl">

        </div>
        <div class="grid grid-cols-3 gap-3">
          ${options.map(o=>`<a href="${o.href}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-1.5 text-center group">
            <span class="h-12 w-12 rounded-2xl flex items-center justify-center text-white shadow-sm group-hover:opacity-85 transition" style="background:${o.bg}">${ic(o.icon,"w-6 h-6")}</span>
            <span class="text-[11px] font-medium text-foreground">${o.label}</span>
          </a>`).join("")}
        </div>
        <div class="mt-4 flex items-center gap-2 rounded-xl bg-secondary p-2">
          <span class="flex-1 truncate text-xs text-muted-foreground px-2">${esc(url)}</span>
          <button data-act="shareCopy" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold text-primary-foreground gradient-hero shrink-0">${ic("copy","w-4 h-4")} Copiar link</button>
        </div>
        ${typeof navigator!=="undefined" && navigator.share ? `<button data-act="shareNative" class="mt-3 w-full flex items-center justify-center gap-2 rounded-xl py-2.5 text-sm font-semibold border border-border text-foreground hover:bg-secondary transition">${ic("moreShare","w-4 h-4")} Mais opções do dispositivo</button>` : ""}
      </div>
    </div>`;
  }

  function downloadFaqModal(){
    const apkUrl = "https://github.com/tuesfortetuesgrande/chatspfc/releases/download/1.0.0/chatspfc.6.apk";
    const faqItems = [
      {
        q: `Por que o celular avisa que o app "pode ser nocivo"?`,

      },
      {
        q: `É seguro instalar mesmo assim?`,
        a: `Sim. O arquivo vem direto do GitHub, uma plataforma pública usada por desenvolvedores do mundo todo para publicar seus próprios apps, e o link é o oficial da torcida. O aviso aparece por causa da origem (fora da loja), não por conteúdo malicioso.`
      },
      {
        q: `Como faço para instalar depois que o aviso aparecer?`,
        a: `1) Toque em "Baixar agora" abaixo.<br/>2) Quando o Android mostrar o aviso, toque em "Mais detalhes" e depois em "Instalar assim mesmo".`
      }
    ];
    return `<div data-act="closeDownloadFaq" class="absolute inset-0 z-40 bg-black/60 flex items-center justify-center p-4 anim-fade overflow-y-auto">

          <span class="text-lg leading-none">⚠️</span>

        </div>

        <div class="space-y-3 mb-5">
          ${faqItems.map(f=>`
            <div>
              <p class="text-sm font-semibold text-foreground flex items-start gap-1.5"><span class="text-primary shrink-0">?</span><span>${f.q}</span></p>
              <p class="text-xs text-muted-foreground leading-relaxed mt-1 pl-4">${f.a}</p>

        <button data-act="downloadApp" class="w-full flex items-center justify-center gap-2 rounded-xl py-3 font-semibold text-primary-foreground gradient-hero transition-all hover:opacity-95 active:scale-[0.99]">
          ${ic("download","w-4 h-4")} Baixar agora
        </button>
        <p class="text-center text-[10.5px] text-muted-foreground mt-3">Aplicativo Tú És Forte, Tú És Grande.</p>
      </div>
    </div>`;
  }

    const reactionEntries = Object.entries(m.reactions || {}).filter(([k, n]) => typeof n === 'number' && n > 0);

    return `<div class="flex gap-2 ${mine?'justify-end':'justify-start'} mb-3">

          ${!mine?`<div class="text-[10px] font-bold mb-0.5 text-primary">${esc(m.nick)}</div>`:""}
          <div class="whitespace-pre-wrap break-words leading-relaxed">${esc(m.text)}</div>
          <div class="text-[9px] mt-1 text-right ${mine?'opacity-75':'opacity-50'}">${m.edited?'<span class="mr-1 italic">editada</span>':''}${fmtTime(m.ts)}</div>

          ${state.openMenu===m.id?`
            <div data-stop class="absolute z-20 top-full mt-1 ${mine?'right-0':'left-0'} bg-popover text-popover-foreground rounded-xl shadow-xl border border-border py-1 text-[11px] min-w-[130px]">
              <button data-act="reply" data-id="${m.id}" class="w-full px-3 py-1.5 text-left hover:bg-secondary flex items-center gap-2 text-foreground">↩️ Responder</button>
              <button data-act="openReact" data-id="${m.id}" class="w-full px-3 py-1.5 text-left hover:bg-secondary flex items-center gap-2 text-foreground">😊 Reagir</button>
              ${mine?`
                <button data-act="edit" data-id="${m.id}" class="w-full px-3 py-1.5 text-left hover:bg-secondary flex items-center gap-2 text-foreground">✏️ Editar</button>
                <button data-act="del" data-id="${m.id}" class="w-full px-3 py-1.5 text-left hover:bg-secondary text-destructive flex items-center gap-2">🗑️ Excluir</button>`:""}

          ${state.openReactions===m.id?`
            <div data-stop class="absolute z-30 -top-14 ${mine?'right-0':'left-0'} bg-popover rounded-full shadow-2xl border border-border px-3 py-1.5 flex gap-2.5 anim-fade items-center justify-between backdrop-blur-md bg-opacity-95">
              ${REACTIONS.map(r=>`
                <button data-act="react" data-id="${m.id}" data-k="${r.k}" title="${r.label}" class="transform hover:scale-125 transition-all duration-150 active:scale-95 w-7 h-7 shrink-0">

  /* ===================== FÓRUM (só texto, stories só foto) ===================== */
  function forumAgo(ts){
    if(!ts) return "agora";
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return "agora";
    if(s<3600) return Math.floor(s/60)+" min";
    if(s<86400) return Math.floor(s/3600)+" h";
    return Math.floor(s/86400)+" d";
  }
  const forumFmt = n => n>=1000 ? (n/1000).toFixed(1).replace(".0","")+"k" : n;
  const forumLinkify = t => esc(t).replace(/(^|\s)(#[\wÀ-ú]+)/g,'$1<span class="text-primary font-semibold">$2</span>');

  function forumCompressImage(file, maxW=720, quality=0.72){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
          canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = r.result;
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function forumPublish(){
    if(state.isGuest){ alert("Só quem tem cadastro (e-mail/senha) pode publicar no fórum. Visitantes podem ler as publicações, mas pra postar é preciso criar uma conta."); return; }
    const text = (state.forumInput||"").trim();
    if(!text) return;
    if(!state.nick.trim()){ alert("Escolha um nick antes de publicar no fórum."); return; }
    const bloqueada = findBlockedWord(text);
    if(bloqueada){ alert("🚫 Sua publicação não pode ser enviada porque contém uma palavra bloqueada."); return; }
    await addDoc(collection(db, "forum_posts"), {
      uid: state.uid, nick: state.nick, avatar: state.avatar,
      text, likes:[], dislikes:[], commentsCount:0, ts: Date.now()
    });
    state.forumInput = "";
    render();
  }

  function forumEditStart(id){
    const p = state.forumPosts.find(x=>x.id===id);
    if(!p) return;
    setState({ forumEditingId:id, forumEditDraft:p.text });
  }

  function forumEditCancel(){
    setState({ forumEditingId:null, forumEditDraft:"" });
  }

  async function forumEditSave(id){
    const text = (state.forumEditDraft||"").trim();
    if(!text) return;
    const bloqueada = findBlockedWord(text);
    if(bloqueada){ alert("🚫 Sua publicação não pode ser salva porque contém uma palavra bloqueada."); return; }
    await updateDoc(doc(db, "forum_posts", id), { text, edited: true });
    setState({ forumEditingId:null, forumEditDraft:"" });
  }

  async function forumDeletePost(id){
    if(!confirm("Excluir esta publicação?")) return;
    await deleteDoc(doc(db, "forum_posts", id));
    if(forumCommentUnsubs[id]){ forumCommentUnsubs[id](); delete forumCommentUnsubs[id]; }
    delete state.forumOpenComments[id];
    delete state.forumComments[id];
  }

  function forumToggleComments(id){
    const isOpen = !!state.forumOpenComments[id];
    if(isOpen){
      state.forumOpenComments[id] = false;
      if(forumCommentUnsubs[id]){ forumCommentUnsubs[id](); delete forumCommentUnsubs[id]; }
      render();
    } else {
      state.forumOpenComments[id] = true;
      if(!forumCommentUnsubs[id]){
        const q = query(collection(db, "forum_posts", id, "comments"), orderBy("ts","asc"));
        forumCommentUnsubs[id] = onSnapshot(q, snap=>{
          state.forumComments[id] = snap.docs.map(d=>d.data());
          render();
        });
      }
      render();
    }
  }

  async function forumSendComment(id){
    const text = (state.forumCommentDraft[id]||"").trim();
    if(!text) return;
    if(!state.nick.trim()){ alert("Escolha um nick antes de comentar."); return; }
    const bloqueada = findBlockedWord(text);
    if(bloqueada){ alert("🚫 Esse comentário contém uma palavra bloqueada."); return; }
    state.forumCommentDraft[id] = "";
    await addDoc(collection(db, "forum_posts", id, "comments"), {
      uid: state.uid, nick: state.nick, avatar: state.avatar, text, ts: Date.now()
    });
    await updateDoc(doc(db, "forum_posts", id), { commentsCount: increment(1) });
    render();
  }

  async function forumVote(id, type){
    const p = state.forumPosts.find(x=>x.id===id);
    if(!p) return;
    const likes = p.likes||[], dislikes = p.dislikes||[];
    const isLike = type==="like";
    const already = isLike ? likes.includes(state.uid) : dislikes.includes(state.uid);
    const update = {};
    if(already){
      update[isLike?"likes":"dislikes"] = arrayRemove(state.uid);
    } else {
      update[isLike?"likes":"dislikes"] = arrayUnion(state.uid);
      update[isLike?"dislikes":"likes"] = arrayRemove(state.uid);
    }
    await updateDoc(doc(db, "forum_posts", id), update);
  }

  function forumAddStory(){
    if(!state.nick.trim()){ alert("Escolha um nick antes de publicar um story."); return; }
    const inp = $("#forumStoryFileInput");
    if(inp) inp.click();
  }

  async function forumStoryFileChange(file){
    if(!file) return;
    try{
      const dataUrl = await forumCompressImage(file);
      await setDoc(doc(db, "forum_stories", state.uid), {
        uid: state.uid, nick: state.nick, avatar: state.avatar, image: dataUrl,
        ts: Date.now(), expiresAt: Date.now() + 24*3600*1000
      });
    }catch(e){ alert("Não foi possível publicar o story. Tente uma foto menor."); }
  }

  function palpiteId(jid, uid){ return `${jid}__${uid}`; }
  function enqueteVotoId(eid, uid){ return `${eid}__${uid}`; }

  function calcRankingBolao(){
    const porUid = {};
    Object.values(state.palpites).forEach(p=>{
      const placar = state.placares[p.jogoId];
      if(!placar) return;
      let pontos = 0;
      if(+p.home === +placar.home && +p.away === +placar.away) pontos = 3;
      else {
        const rp = Math.sign(p.home - p.away);
        const rr = Math.sign(placar.home - placar.away);
        if(rp === rr) pontos = 1;
      }
      if(!porUid[p.uid]) porUid[p.uid] = { nick: p.nick, pontos: 0 };
      porUid[p.uid].pontos += pontos;
      porUid[p.uid].nick = p.nick;
    });
    return Object.entries(porUid).map(([uid,v])=>({uid,...v})).sort((a,b)=>b.pontos-a.pontos).slice(0,10);
  }

    const votosDaAtiva = enqueteAtiva ? Object.values(state.enqueteVotos).filter(v=>v.enqueteId===enqueteAtiva.id) : [];
    const totalVotos = votosDaAtiva.length;

    const enqueteHtml = `

            ${enqueteAtiva.opcoes.map((op,i)=>{

    const adminEnqueteHtml = isAdmin(state.user) ? `

        ${state.enquetes.length?`

          ${state.enquetes.map(en=>`

    return section(titleHtml, `
      ${rankingHtml}
      <p class="font-bold text-foreground text-sm mt-1">Palpites em aberto</p>
      <div class="space-y-3">${palpitesHtml}</div>

  function quizPage(){
    const q = state.quiz;

    switch(q.screen){
      case "howto": inner = quizHowToScreen(); break;
      case "phases": inner = quizPhaseMapScreen(); break;
      case "question": inner = quizQuestionScreen(); break;

      default: inner = quizHomeScreen();

    return `<div class="h-full overflow-y-auto scrollbar-thin quiz-shell">
      <div class="quiz-stadium-bg">${quizParticlesHtml()}</div>
      <div id="quizConfettiLayer" class="quiz-confetti-layer"></div>
      <div class="quiz-content p-5 sm:p-6 space-y-4 pb-8">${inner}</div>
      ${q.toast?quizToastHtml():""}
    </div>`;
  }

  function quizParticlesHtml(){
    const particles = Array.from({length:16}, () => {
      const left = Math.round(Math.random()*100);
      const size = (Math.random()*3+2).toFixed(1);
      const dur = (Math.random()*8+8).toFixed(1);
      const delay = (Math.random()*8).toFixed(1);
      const drift = Math.round((Math.random()-0.5)*80);
      return `<span class="quiz-particle" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--drift:${drift}px;"></span>`;
    }).join("");
    return `<span class="quiz-glow" style="width:220px;height:220px;left:-60px;top:-40px"></span>
      <span class="quiz-glow" style="width:260px;height:260px;right:-80px;bottom:-60px;animation-delay:1.5s"></span>
      ${particles}`;
  }

  function quizQuestionScreen(){

    const fase = QUIZ_PHASES[q.phaseIdx];
    const pergunta = fase.perguntas[q.qIdx];
    const answered = q.selected !== null;
    const isLast = q.qIdx+1 >= fase.perguntas.length;
    const letras = ["A","B","C","D"];
    return `

          let cls="";
          if(i<q.qIdx) cls = q.acertosLog[i] ? "is-correct" : "is-wrong";
          else if(i===q.qIdx) cls="is-current";
          return `<span class="quiz-progress-dot ${cls}"></span>`;
        }).join("")}

          ${pergunta.o.map((opt,i)=>{
