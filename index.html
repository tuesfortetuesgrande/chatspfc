  /* ===== Lógica do quiz: cronômetro, respostas e transições ===== */
  let quizTimerInterval = null;
  function startQuizTimer(){
    clearQuizTimer();
    state.quiz.timeLeft = QUIZ_TEMPO_PERGUNTA;
    state.quiz.questionStartTs = Date.now();
    quizTimerInterval = setInterval(()=>{
      state.quiz.timeLeft--;
      updateQuizTimerOnly();
      if(state.quiz.timeLeft===5) quizPlaySound("tick");
      if(state.quiz.timeLeft<=0){
        clearQuizTimer();
        if(state.quiz.selected===null) quizAnswer(-1);
      }
    },1000);
  }
  function clearQuizTimer(){ if(quizTimerInterval){ clearInterval(quizTimerInterval); quizTimerInterval=null; } }
  function updateQuizTimerOnly(){
    const bar = document.getElementById("quizTimerBar"), txt = document.getElementById("quizTimerText");
    if(!bar||!txt) return;
    const pct = Math.max(0,(state.quiz.timeLeft/QUIZ_TEMPO_PERGUNTA)*100);
    bar.style.width = pct+"%";
    bar.classList.toggle("quiz-timer-danger", state.quiz.timeLeft<=5);
    txt.textContent = Math.max(0,state.quiz.timeLeft);
  }

  function quizEnterPhase(idx, manterSessao){
    const q = state.quiz;
    if(!manterSessao){ /* mantém sessão entre fases, só reseta ao começar do zero (ver quizResetSessao) */ }
    q.phaseIdx = idx; q.qIdx = 0; q.selected = null; q.corretasFase = 0; q.acertosLog = [];
    q.screen = "question";
    startQuizTimer();
    render();
  }
  function quizResetSessao(){
    state.quiz.sessao = { pontos:0, corretas:0, respondidas:0, combo:0, maiorCombo:0, tempoMs:0, velozes:0 };
  }

  function quizAnswer(i){
    const q = state.quiz;
    if(q.selected!==null) return;
    clearQuizTimer();
    const fase = QUIZ_PHASES[q.phaseIdx];
    const pergunta = fase.perguntas[q.qIdx];
    q.selected = i;
    const elapsedMs = Date.now() - (q.questionStartTs||Date.now());
    const isCorrect = i===pergunta.a;
    q.acertosLog[q.qIdx] = isCorrect;
    q.sessao.respondidas++;
    q.sessao.tempoMs += elapsedMs;
    state.quizProgress.stats.perguntasRespondidas++;
    state.quizProgress.stats.tempoTotalMs += elapsedMs;
    if(isCorrect){
      q.corretasFase++;
      q.sessao.corretas++;
      q.sessao.combo++;
      q.sessao.maiorCombo = Math.max(q.sessao.maiorCombo, q.sessao.combo);
      state.quizProgress.stats.acertos++;
      state.quizProgress.stats.maiorSequencia = Math.max(state.quizProgress.stats.maiorSequencia||0, q.sessao.combo);
      let pontos = 100;
      if(elapsedMs < 8000) pontos += 50;
      if(elapsedMs < 5000) q.sessao.velozes++;
      if(q.sessao.combo>0 && q.sessao.combo%3===0) pontos += 100;
      q.sessao.pontos += pontos;
      quizPlaySound("correct");
      quizUnlockAchievement("primeiro_acerto");
      if(quizPontosTotais()>=1000) quizUnlockAchievement("mil_pontos");
      if(q.sessao.velozes>=5) quizUnlockAchievement("velocista");
    } else {
      q.sessao.combo = 0;
      q.shake = true;
      quizPlaySound("wrong");
      setTimeout(()=>{ q.shake=false; render(); }, 420);
    }
    saveQuizProgress();
    render();
  }

  function quizAdvance(){
    const q = state.quiz;
    if(q.selected===null) return;
    const fase = QUIZ_PHASES[q.phaseIdx];
    const isLast = q.qIdx+1 >= fase.perguntas.length;
    quizPlaySound("click");
    if(isLast){
      quizFinishPhase();
    } else {
      q.qIdx++; q.selected = null;
      startQuizTimer();
      render();
    }
  }

  function quizFinishPhase(){
    const q = state.quiz;
    const fase = QUIZ_PHASES[q.phaseIdx];
    const corretas = q.corretasFase;
    const estrelasGanhas = corretas>=7?3:corretas>=6?2:corretas>=5?1:0;
    const anteriores = state.quizProgress.estrelas[fase.id]||0;
    if(estrelasGanhas>anteriores){
      state.quizProgress.estrelas[fase.id] = estrelasGanhas;
      if(anteriores===0 && estrelasGanhas>0) quizUnlockAchievement("primeira_estrela");
    }
    state.quizProgress.stats.partidas++;
    if(corretas===fase.perguntas.length) quizUnlockAchievement("sete_de_sete");
    quizUnlockAchievement("fase_concluida");
    const todasEstrelas = QUIZ_PHASES.every(f=>(state.quizProgress.estrelas[f.id]||0)>=3);
    if(todasEstrelas) quizUnlockAchievement("enciclopedia");
    saveQuizProgress();
    clearQuizTimer();
    quizPlaySound(estrelasGanhas>0?"phase":"wrong");
    if(estrelasGanhas>0) spawnQuizConfetti(36);
    q.screen = "phaseResult";
    render();
  }

  function quizFinishGame(){
    const q = state.quiz;
    quizUnlockAchievement("jogo_completo");
    if(q.sessao.respondidas>0 && q.sessao.corretas===q.sessao.respondidas) quizUnlockAchievement("sem_errar");
    updateQuizStreak(q.sessao.corretas);
    addQuizLocalRankingEntry({
      nome: state.nick.trim() || "Torcedor",
      pontos: q.sessao.pontos,
      data: new Date().toLocaleDateString("pt-BR"),
      tempoMs: q.sessao.tempoMs,
      estrelas: Object.values(state.quizProgress.estrelas).reduce((a,b)=>a+b,0),
    });
    quizPlaySound("victory");
    spawnQuizConfetti(70);
    q.screen = "final";
    render();
  }

  function spawnQuizConfetti(qtd){
    const layer = document.getElementById("quizConfettiLayer");
    if(!layer) return;
    const cores = ["#D50000","#FFFFFF","#111111","#ff5252","#ffca28"];
    for(let i=0;i<qtd;i++){
      const el = document.createElement("div");
      el.className = "quiz-confetti-piece";
      const size = 6+Math.random()*6;
      const dur = 2.2+Math.random()*1.6;
      const delay = Math.random()*0.4;
      el.style.left = (Math.random()*100)+"%";
      el.style.width = size+"px";
      el.style.height = (size*0.4)+"px";
      el.style.background = cores[Math.floor(Math.random()*cores.length)];
      el.style.animationDuration = dur+"s";
      el.style.animationDelay = delay+"s";
      layer.appendChild(el);
      setTimeout(()=>el.remove(), (dur+delay)*1000+250);
    }
  }

  async function quizShareResult(){
    const q = state.quiz;
    const pct = q.sessao.respondidas ? Math.round((q.sessao.corretas/q.sessao.respondidas)*100) : 0;
    const texto = `Acabei de jogar o Quiz São Paulo FC e acertei ${q.sessao.corretas}/${q.sessao.respondidas} perguntas (${pct}%)! 🔴⚪⚫ Sou Tricolor de coração!`;
    try{
      if(navigator.share) await navigator.share({title:"Quiz São Paulo FC", text:texto, url:location.href});
      else { await navigator.clipboard.writeText(texto); state.shareMsg="Resultado copiado!"; render(); setTimeout(()=>{state.shareMsg=""; render();},2000); }
    }catch(e){}
  }


  /* ===================== CADASTRO / LOGIN DO TORCEDOR =====================
     A tela de cadastro que existia dentro do chat embutido foi removida.
     Agora o cadastro (e-mail + senha) acontece aqui, junto com o nick e o
     avatar. A conta é criada no MESMO projeto Firebase do ChatMSN, então o
     chat reconhece a sessão automaticamente. */
  function nickValido(){
    const nick = state.nick.trim();
    if(!nick){ state.authError = "Escolha seu nick para continuar."; render(); return false; }
    const bloqueada = findBlockedWord(nick);
    if(bloqueada){ state.authError = "Esse apelido não é permitido neste chat. Escolha outro nome."; render(); return false; }
    return true;
  }

  function traduzErroAuth(err){
    const map = {
      "auth/invalid-email": "E-mail inválido.",
      "auth/user-not-found": "Não existe conta com esse e-mail.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/email-already-in-use": "Já existe uma conta com esse e-mail. Use a aba \"Já tenho conta\".",
      "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
      "auth/network-request-failed": "Sem conexão. Tente de novo.",
    };
    return map[err && err.code] || "Não foi possível concluir. Tente novamente.";
  }

  async function submitAuth(){
    if(state.authLoading) return;
    if(!nickValido()) return;
    const email = (state.authEmail||"").trim();
    const senha = state.authSenha||"";
    if(!email || senha.length < 6){
      state.authError = "Informe um e-mail válido e uma senha com pelo menos 6 caracteres.";
      render(); return;
    }
    state.authError = ""; state.authLoading = true; render();
    try{
      if(state.authMode === "signup"){
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        const uid = cred.user.uid;
        await setDoc(doc(db, "users", uid), {
          nick: state.nick.trim(),
          avatar: state.avatar,
          email: email,
          createdAt: new Date()
        }, { merge:true });
        state.uid = uid;
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const uid = cred.user.uid;
        try{
          const snap = await getDoc(doc(db, "users", uid));
          const data = snap.exists() ? snap.data() : {};
          if(data.avatar && state.avatar === avatarUrl(AVATAR_SEEDS[0])) state.avatar = data.avatar;
        }catch(e){}
        await setDoc(doc(db, "users", uid), {
          nick: state.nick.trim(),
          avatar: state.avatar,
          email: email
        }, { merge:true });
        state.uid = uid;
      }
      state.authLoading = false;
      state.authSenha = "";
      setState({ entered:true, isGuest:false, showGuestInfo:false });
      syncChatIdentity();
    }catch(err){
      console.error("Erro no cadastro/login:", err);
      state.authLoading = false;
      state.authError = traduzErroAuth(err);
      render();
    }
  }

  function entrarComoVisitante(){
    state.uid = getUid();
    setState({ entered:true, isGuest:true, showGuestInfo:false });
    syncChatIdentity();
  }

  /* ===================== EVENTS ===================== */
  function bind(){
    const root = $("#app");
    if(!root) return;
    root.onclick = handleClick;
    
    const nick = $("#nickInput");
    if(nick) {
      nick.oninput = e => { 
        state.nick = e.target.value; 
        const b=$("#enterBtn"); 
        if(b){ if(state.nick.trim()) b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } 
      };
    }
    
    const authEmail = $("#authEmailInput");
    if(authEmail) authEmail.oninput = e => { state.authEmail = e.target.value; };
    const authSenha = $("#authSenhaInput");
    if(authSenha){
      authSenha.oninput = e => { state.authSenha = e.target.value; };
      authSenha.onkeydown = e => { if(e.key==="Enter") submitAuth(); };
    }

    const enter = $("#enterBtn");
    if(enter) enter.onclick = () => submitAuth();
    
    const mi = $("#msgInput");
    if(mi){
      mi.oninput = e => { state.input = e.target.value; };
      mi.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
      mi.focus(); mi.selectionStart = mi.value.length;
    }

    const ph = $("#placarHomeInput");
    if(ph) ph.oninput = e => { state.tempHome = e.target.value; };
    const pa = $("#placarAwayInput");
    if(pa) pa.oninput = e => { state.tempAway = e.target.value; };
    const gh = $("#golsHomeInput");
    if(gh) gh.oninput = e => { state.tempGolsHome = e.target.value; };
    const ga = $("#golsAwayInput");
    if(ga) ga.oninput = e => { state.tempGolsAway = e.target.value; };

    const ae = $("#adminEmailInput");
    if(ae) ae.oninput = e => { state.adminEmail = e.target.value; };
    const as = $("#adminSenhaInput");
    if(as){
      as.oninput = e => { state.adminSenha = e.target.value; };
      as.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); doAdminLogin(); } };
    }

    const pph = $("#palpiteHomeInput");
    if(pph) pph.oninput = e => { state.palpiteTempHome = e.target.value; };
    const ppa = $("#palpiteAwayInput");
    if(ppa) ppa.oninput = e => { state.palpiteTempAway = e.target.value; };

    const epi = $("#enquetePerguntaInput");
    if(epi) epi.oninput = e => { state.novaEnquetePergunta = e.target.value; };
    document.querySelectorAll(".enqueteOpcaoInput").forEach(inp=>{
      inp.oninput = e => {
        const idx = +inp.dataset.opcaoIdx;
        const copia = [...state.novaEnqueteOpcoes];
        copia[idx] = e.target.value;
        state.novaEnqueteOpcoes = copia;
      };
    });

    const fc = $("#forumComposer");
    if(fc){
      fc.oninput = e => {
        state.forumInput = e.target.value;
        const btn = root.querySelector('[data-act="forumPublish"]');
        if(btn){ if(state.forumInput.trim()) btn.removeAttribute("disabled"); else btn.setAttribute("disabled",""); }
        const counter = $("#forumCounter");
        if(counter) counter.textContent = (500-state.forumInput.length)+" caracteres";
      };
    }
    const fec = $("#forumEditComposer");
    if(fec){
      fec.oninput = e => {
        state.forumEditDraft = e.target.value;
        const btn = root.querySelector('[data-act="forumEditSave"]');
        if(btn){ if(state.forumEditDraft.trim()) btn.removeAttribute("disabled"); else btn.setAttribute("disabled",""); }
      };
    }
    document.querySelectorAll(".forumComentInput").forEach(inp=>{
      inp.oninput = e => { state.forumCommentDraft[inp.dataset.post] = e.target.value; };
      inp.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); forumSendComment(inp.dataset.post); } };
    });
    const fsi = $("#forumStoryFileInput");
    if(fsi){
      fsi.onchange = () => {
        const file = fsi.files[0]; fsi.value = "";
        forumStoryFileChange(file);
      };
    }
  }

  async function handleClick(e){
    const stop = e.target.closest("[data-stop]");
    const t = e.target.closest("[data-act]");
    if(!t) return;
    if(stop && !t.contains(stop) && !stop.contains(t)) return;
    const a = t.dataset.act;
    switch(a){
      case "toggleDark": state.dark=!state.dark; render(); break;
      case "pickAvatar": state.avatar = avatarUrl(t.dataset.seed); render(); break;
      case "authTab": setState({authMode: t.dataset.mode, authError:""}); break;
      case "guestInfo": if(nickValido()) setState({showGuestInfo:true, authError:""}); break;
      case "guestConfirm": entrarComoVisitante(); break;
      case "guestBack": setState({showGuestInfo:false, authMode:"signup"}); break;
      case "openMenu": setState({menuOpen:true}); break;
      case "closeMenu": if(t.tagName==="BUTTON"||!e.target.closest("[data-stop]")) setState({menuOpen:false}); break;
      case "setPage": {
        document.body.classList.remove("chat-keyboard-open");
        if(t.dataset.key!=="quiz") clearQuizTimer();
        setState({page:t.dataset.key, menuOpen:false, openMenu:null, openReactions:null});
        if(t.dataset.key==="tabela" && (!state.brasileirao.entries || Date.now()-(state.brasileirao.updatedAt||0) > 120000)) fetchBrasileirao();
        break;
      }
      case "refreshTabela": fetchBrasileirao(); break;
      case "openAvatarPicker": setState({showAvatarPicker:true, menuOpen:false}); break;
      case "closeAvatarPicker": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showAvatarPicker:false}); break;
      case "setAvatar": state.avatar = avatarUrl(t.dataset.seed); setState({showAvatarPicker:false}); break;
      case "openThemes": setState({showThemes:true, menuOpen:false}); break;
      case "closeThemes": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showThemes:false}); break;
      case "pickTheme": state.themeIdx=+t.dataset.i; setState({showThemes:false}); break;
      case "share": shareApp(); break;
      case "openShare": setState({showShare:true, menuOpen:false}); break;
      case "openDownloadFaq": setState({showDownloadFaq:true, menuOpen:false}); break;
      case "closeDownloadFaq": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showDownloadFaq:false}); break;
      case "downloadApp": {
        // Link real do APK (GitHub Releases). O clique é disparado a partir
        // desta página, então o Analytics registra quem realmente clicou
        // aqui dentro — diferente de compartilhar o link puro do GitHub.
        if (typeof gtag === "function") {
          gtag("event", "file_download", {
            file_name: "chatspfc.6.apk",
            file_extension: "apk",
            link_url: "https://github.com/tuesfortetuesgrande/chatspfc/releases/download/1.0.0/chatspfc.6.apk"
          });
        }
        window.open("https://github.com/tuesfortetuesgrande/chatspfc/releases/download/1.0.0/chatspfc.6.apk", "_blank");
        setState({ menuOpen:false, showDownloadFaq:false });
        break;
      }
      case "closeShare": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({showShare:false}); break;
      case "shareCopy": {
        try{
          await navigator.clipboard.writeText(location.href);
          state.shareMsg="Link copiado!"; render();
          setTimeout(()=>{state.shareMsg=""; render();},2000);
        }catch{}
        break;
      }
      case "shareNative": {
        try{ await navigator.share({title:"Chat Tú és Forte, Tú és Grande",text:"Entre no Chat Tú és Forte, Tú és Grande e vem torcer com a gente!",url:location.href}); }catch{}
        break;
      }
      case "logout": document.body.classList.remove("chat-keyboard-open"); clearQuizTimer(); signOut(auth).catch(()=>{}); Object.assign(state,{entered:false,messages:[],input:"",editingId:null,replyId:null,page:"chat",menuOpen:false,showAvatarPicker:false,showThemes:false,showShare:false,showDownloadFaq:false,isGuest:false,showGuestInfo:false,authMode:"signup",authEmail:"",authSenha:"",authError:""}); render(); break;
      case "send": send(); break;
      case "cancelReplyEdit": state.replyId=null; if(state.editingId){state.editingId=null; state.input="";} render(); break;
      case "toggleMenu": e.stopPropagation(); setState({openMenu: state.openMenu===t.dataset.id?null:t.dataset.id, openReactions:null}); break;
      case "reply": setState({replyId:t.dataset.id, openMenu:null}); break;
      case "openReact": setState({openReactions:t.dataset.id, openMenu:null}); break;
      case "edit": { const m=state.messages.find(x=>x.id===t.dataset.id); if(m){state.editingId=m.id; state.input=m.text; state.replyId=null; state.openMenu=null; render();} break; }
      case "del": 
        await deleteDoc(doc(db, "mensagens", t.dataset.id));
        if(state.editingId===t.dataset.id){state.editingId=null;state.input="";} 
        state.openMenu=null; 
        break;
      case "react": { 
        const id=t.dataset.id, k=t.dataset.k; 
        const m=state.messages.find(x=>x.id===id);
        if(m){
          const currentReactions = m.reactions || {};
          await updateDoc(doc(db, "mensagens", id), {
            [`reactions.${k}`]: (currentReactions[k] || 0) + 1
          });
        }
        state.openReactions=null; 
        break; 
      }
      case "closeOverlays": if(state.openMenu||state.openReactions) setState({openMenu:null,openReactions:null}); break;

      case "forumPublish": await forumPublish(); break;
      case "forumEditStart": forumEditStart(t.dataset.id); break;
      case "forumEditCancel": forumEditCancel(); break;
      case "forumEditSave": await forumEditSave(t.dataset.id); break;
      case "forumDelete": await forumDeletePost(t.dataset.id); break;
      case "forumLike": await forumVote(t.dataset.id, "like"); break;
      case "forumDislike": await forumVote(t.dataset.id, "dislike"); break;
      case "forumToggleComments": forumToggleComments(t.dataset.id); break;
      case "forumSendComment": await forumSendComment(t.dataset.id); break;
      case "forumAddStory": forumAddStory(); break;
      case "forumViewStory": {
        const s = state.forumStories.find(x=>x.id===t.dataset.id);
        if(s){
          setState({ forumStoryViewer: s });
          if(s.uid!==state.uid){
            const jaViu = (s.viewedBy||[]).includes(state.uid);
            if(!jaViu) await updateDoc(doc(db, "forum_stories", s.id), { viewedBy: arrayUnion(state.uid) }).catch(()=>{});
          }
        }
        break;
      }
      case "forumCloseStory": if(!e.target.closest("[data-stop]")||t.tagName==="BUTTON") setState({forumStoryViewer:null}); break;
      case "quizGoHome": clearQuizTimer(); state.quiz.screen="home"; render(); break;
      case "quizGoHowTo": state.quiz.screen="howto"; render(); break;
      case "quizGoPhases": clearQuizTimer(); quizResetSessao(); state.quiz.screen="phases"; render(); break;
      case "quizGoRanking": state.quiz.screen="ranking"; render(); break;
      case "quizSelectPhase": quizEnterPhase(+t.dataset.i); break;
      case "quizAnswer": quizAnswer(+t.dataset.i); break;
      case "quizNextQuestion": quizAdvance(); break;
      case "quizNextPhase": quizEnterPhase(state.quiz.phaseIdx+1); break;
      case "quizRetryPhase": quizEnterPhase(state.quiz.phaseIdx); break;
      case "quizFinishGame": quizFinishGame(); break;
      case "quizToggleSom": quizToggleSom(); break;
      case "quizShareResult": await quizShareResult(); break;
      case "editPlacar": {
        if(!isAdmin(state.user)){
          alert('Você precisa fazer login como administrador primeiro. Vá até a aba "Administrador" no menu.');
          return;
        }
        const id = t.dataset.id;
        const atual = state.placares[id];
        setState({ editingJogoId:id, tempHome: atual?String(atual.home):"", tempAway: atual?String(atual.away):"", tempGolsHome: atual?.golsHome||"", tempGolsAway: atual?.golsAway||"" });
        break;
      }
      case "cancelPlacar": setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" }); break;
      case "savePlacar": {
        const id = t.dataset.id;
        const h = state.tempHome.trim(), av = state.tempAway.trim();
        if(h==="" || av==="" || isNaN(+h) || isNaN(+av) || +h<0 || +av<0){
          alert("Preencha os dois placares com números válidos.");
          return;
        }
        await setDoc(doc(adminDb, "placares", id), { home:+h, away:+av, golsHome: state.tempGolsHome.trim(), golsAway: state.tempGolsAway.trim() });
        setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" });
        break;
      }
      case "clearPlacar": {
        const id = t.dataset.id;
        await deleteDoc(doc(adminDb, "placares", id));
        setState({ editingJogoId:null, tempHome:"", tempAway:"", tempGolsHome:"", tempGolsAway:"" });
        break;
      }
      case "adminLogin": await doAdminLogin(); break;
      case "adminLogout": await signOut(adminAuth); break;

      case "editarPalpite": {
        const id = t.dataset.id;
        const atual = state.palpites[palpiteId(id, state.uid)];
        setState({ palpiteEditingId:id, palpiteTempHome: atual?String(atual.home):"", palpiteTempAway: atual?String(atual.away):"" });
        break;
      }
      case "cancelarPalpite": setState({ palpiteEditingId:null, palpiteTempHome:"", palpiteTempAway:"" }); break;
      case "salvarPalpite": {
        const id = t.dataset.id;
        const h = state.palpiteTempHome.trim(), av = state.palpiteTempAway.trim();
        if(h==="" || av==="" || isNaN(+h) || isNaN(+av) || +h<0 || +av<0){
          alert("Preencha os dois placares do seu palpite com números válidos.");
          return;
        }
        if(!state.nick.trim()){ alert("Escolha um nome antes de palpitar."); return; }
        await setDoc(doc(db, "palpites", palpiteId(id, state.uid)), { uid: state.uid, nick: state.nick, jogoId: id, home:+h, away:+av, ts: Date.now() });
        setState({ palpiteEditingId:null, palpiteTempHome:"", palpiteTempAway:"" });
        break;
      }
      case "abrirBolao": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await setDoc(doc(adminDb, "boloes", id), { aberto:true });
        render();
        break;
      }
      case "fecharBolao": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await setDoc(doc(adminDb, "boloes", id), { aberto:false });
        render();
        break;
      }
      case "addOpcaoEnquete": {
        if(state.novaEnqueteOpcoes.length>=4) return;
        setState({ novaEnqueteOpcoes:[...state.novaEnqueteOpcoes, ""] });
        break;
      }
      case "criarEnquete": {
        if(!isAdmin(state.user)) return;
        const pergunta = state.novaEnquetePergunta.trim();
        const opcoes = state.novaEnqueteOpcoes.map(o=>o.trim()).filter(Boolean);
        if(!pergunta || opcoes.length<2){ alert("Preencha a pergunta e ao menos 2 opções."); return; }
        await addDoc(collection(adminDb, "enquetes"), { pergunta, opcoes, ativa:true, criadaEm: Date.now() });
        setState({ novaEnquetePergunta:"", novaEnqueteOpcoes:["",""] });
        break;
      }
      case "encerrarEnquete": {
        if(!isAdmin(state.user)) return;
        const id = t.dataset.id;
        await updateDoc(doc(adminDb, "enquetes", id), { ativa:false });
        render();
        break;
      }
      case "votarEnquete": {
        const id = t.dataset.id, i = +t.dataset.i;
        if(!state.nick.trim()){ alert("Escolha um nome antes de votar."); return; }
        await setDoc(doc(db, "enquete_votos", enqueteVotoId(id, state.uid)), { enqueteId:id, uid:state.uid, opcao:i, ts: Date.now() });
        render();
        break;
      }
    }
  }

  async function doAdminLogin(){
    const email = (state.adminEmail||"").trim();
    const senha = state.adminSenha||"";
    if(!email || !senha){ state.loginError = "Preencha e-mail e senha."; render(); return; }
    try{
      await signInWithEmailAndPassword(adminAuth, email, senha);
      state.adminSenha = "";
      state.loginError = "";
      render();
    }catch(err){
      state.loginError = "E-mail ou senha inválidos.";
      render();
    }
  }

  async function send(){
    const text = (state.input||"").trim();
    if(!text) return;

    const bloqueada = findBlockedWord(text);
    if(bloqueada){
      alert("🚫 Sua mensagem não pode ser enviada porque contém uma palavra bloqueada neste chat.");
      return;
    }
    
    if(state.editingId){
      await updateDoc(doc(db, "mensagens", state.editingId), {
        text,
        edited: true
      });
      state.editingId=null;
    } else {
      await addDoc(collection(db, "mensagens"), {
        author: "me",
        uid: state.uid,
        nick: state.nick,
        avatar: state.avatar,
        text,
        ts: Date.now(),
        reactions: {},
        replyTo: state.replyId || null
      });
      state.replyId=null;

      setTimeout(async ()=>{
        await addDoc(collection(db, "mensagens"), {
          author: "bot",
          nick: BOT.nick,
          avatar: BOT.avatar,
          text: BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)],
          ts: Date.now(),
          reactions: {}
        });
      }, 900+Math.random()*800);
    }
    state.input="";
    render();
  }

  async function shareApp(){
    const url = location.href;
    const data = {title:"ChatVibe",text:"Entre no ChatVibe e converse comigo!",url};
    try{
      if(navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(url); state.shareMsg="Link copiado!"; render(); setTimeout(()=>{state.shareMsg=""; render();},2000); }
    }catch{}
  }

  // ===================== INTEGRAÇÃO COM O BOTÃO FÍSICO DE VOLTAR (ANDROID/KODULAR) =====================
  // O Kodular deve chamar esta função via WebViewer.RunJavaScript("handleAndroidBack()")
  // dentro do evento "Screen.BackPressed". Ela decide o que fazer dentro do app em vez de
  // deixar o botão físico sair direto do aplicativo:
  //   1) fecha qualquer modal aberto (temas, avatar, compartilhar, FAQ de download)
  //   2) fecha o menu/drawer lateral, se estiver aberto
  //   3) tira o foco do campo de digitar mensagem do chat (que está dentro do iframe),
  //      caso o "modo teclado" esteja ativo, fazendo o cabeçalho reaparecer
  //   4) se a pessoa estiver em outra aba (não no chat), volta pra aba do chat
  //   5) se nada disso se aplicar (já está no chat, sem nada aberto), retorna false/"exit",
  //      indicando que o Kodular pode deixar o botão fechar o app normalmente.
  // Além do "return", também avisamos o resultado via AppInventor.setWebViewString, que é a forma
  // mais confiável de o bloco do Kodular capturar a resposta desta função (ouvindo
  // WebViewer1.WebViewStringChanged), já que o valor de retorno de RunJavaScript nem sempre
  // chega de volta aos blocos.
  window.handleAndroidBack = function () {
    let handled = false;
    try {
      if (state.showThemes || state.showAvatarPicker || state.showShare || state.showDownloadFaq) {
        setState({ showThemes: false, showAvatarPicker: false, showShare: false, showDownloadFaq: false });
        handled = true;
      } else if (state.menuOpen) {
        setState({ menuOpen: false });
        handled = true;
      } else {
        const frame = document.getElementById("msnChatFrame");
        const active = frame && frame.contentDocument ? frame.contentDocument.activeElement : null;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
          active.blur();
          handled = true;
        } else if (state.page !== "chat") {
          setState({ page: "chat" });
          handled = true;
        }
      }
    } catch (e) {
      handled = false;
    }
    try {
      if (window.AppInventor && window.AppInventor.setWebViewString) {
        window.AppInventor.setWebViewString(handled ? "handled" : "exit");
      }
    } catch (e) { /* ignora se não estiver dentro do Kodular */ }
    return handled;
  };

  setInterval(() => {
    if (!state.entered) return;
    let n = Math.floor(Math.random() * ADS.length);
    if (n === state.adIndex) n = (n + 1) % ADS.length;
    state.adIndex = n;
    updateAdOnly();
  }, 7000);

  // Atualiza a tabela do Brasileirão sozinha a cada 5 minutos, enquanto a aba estiver aberta
  setInterval(() => {
    if (state.entered && state.page === "tabela") fetchBrasileirao();
  }, 5*60*1000);

  // Executa o primeiro render logo de cara para abrir a tela de login
  render();
</script>
